<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلامة النظام المحاسبي | نيو سي برنسيس فرع الزقازيق</title>
  <script>tailwind={config:{theme:{extend:{colors:{primary:"#1B5E20",lightGreen:"#2E7D32",gold:"#B8860B",lightGold:"#DAA520",darkBg:"#0D1B0E",offWhite:"#F8F5EC",borderGold:"#D4AF6A",success:"#2E7D32",warning:"#F57F17",error:"#C62828"},fontFamily:{sans:["Cairo","sans-serif"]}}}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/custom.css">
  <link rel="stylesheet" href="/css/erp-ui.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js"></script>
  <script src="/js/admin.js"></script>
  <style>

    /* Status badge colours */
    .badge-healthy  { background:#dcfce7; color:#166534; }
    .badge-warning  { background:#fef9c3; color:#854d0e; }
    .badge-critical { background:#fee2e2; color:#991b1b; }

    /* Overall status banner */
    .banner-healthy  { background:#16a34a; }
    .banner-warning  { background:#d97706; }
    .banner-critical { background:#dc2626; }

    /* Check card left border */
    .check-healthy  { border-right:4px solid #16a34a; }
    .check-warning  { border-right:4px solid #d97706; }
    .check-critical { border-right:4px solid #dc2626; }

    /* Spinner */
    @keyframes spin { to { transform:rotate(360deg); } }
    .spin { animation:spin 1s linear infinite; }

    /* Pulse for critical */
    @keyframes pulse-red { 0%,100%{opacity:1} 50%{opacity:.6} }
    .pulse-critical { animation:pulse-red 1.5s ease-in-out infinite; }
  </style>
  <script src="/js/admin-nav.js"></script>
</head>
<body class="bg-gray-100 min-h-screen" style="font-family:'Cairo',sans-serif;">

<div id="adminNavMount"></div>

  <!-- ══ MAIN CONTENT ══ -->
    <main class="flex-1 flex flex-col p-6 overflow-auto" aria-label="المحتوى الرئيسي">

      <!-- Header -->
      <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
        <div>
          <h2 class="text-2xl font-bold text-gray-800 border-b-2 border-primary pb-1" aria-label="سلامة النظام المحاسبي">سلامة النظام المحاسبي</h2>
          <p class="text-sm text-gray-500 mt-1">فحص شامل لسلامة البيانات المالية والمحاسبية</p>
        </div>
        <div class="flex gap-2">
          <button onclick="runHealthCheck()" id="refreshBtn"
            class="bg-primary hover:bg-lightGreen text-white font-bold py-2 px-5 rounded-lg flex items-center gap-2 transition text-sm">
            <i class="fa-solid fa-rotate" id="refreshIcon"></i> تشغيل الفحص
          </button>
          <button onclick="window.print()"
            class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 px-4 rounded-lg flex items-center gap-2 transition text-sm">
            <i class="fa-solid fa-print"></i> طباعة
          </button>
        </div>
      </div>

      <!-- Production Status (Phase R) -->
      <div id="prodStatusCard" class="hidden erp-card mb-6 p-5">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-bold text-gray-700 flex items-center gap-2">
            <i class="fa-solid fa-rocket text-primary"></i> جاهزية الإنتاج
          </h3>
          <span id="prodStatusBadge" class="badge"></span>
        </div>
        <div id="prodStatusGrid" class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm"></div>
        <p class="text-xs text-gray-400 mt-3" id="prodStatusMeta"></p>
      </div>

      <!-- Overall Banner -->
      <div id="overallBanner" class="rounded-2xl text-white p-6 mb-6 hidden">
        <div class="flex flex-col md:flex-row items-center gap-4">
          <div id="bannerIcon" class="text-5xl"></div>
          <div class="flex-1 text-center md:text-right">
            <p id="bannerTitle" class="text-2xl font-bold"></p>
            <p id="bannerSub"   class="text-sm opacity-80 mt-1"></p>
          </div>
          <div class="flex gap-6 text-center">
            <div>
              <p id="cntCritical" class="text-3xl font-bold"></p>
              <p class="text-xs opacity-70">حرجة</p>
            </div>
            <div>
              <p id="cntWarning"  class="text-3xl font-bold"></p>
              <p class="text-xs opacity-70">تحذيرات</p>
            </div>
            <div>
              <p id="cntHealthy"  class="text-3xl font-bold"></p>
              <p class="text-xs opacity-70">سليمة</p>
            </div>
          </div>
        </div>
        <p id="bannerTime" class="text-xs opacity-60 mt-3 text-center"></p>
      </div>

      <!-- Balance Sheet Integrity -->
      <div id="bsCard" class="bg-white rounded-xl shadow border border-gray-200 p-5 mb-6 hidden">
        <h3 class="font-bold text-gray-700 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-scale-balanced text-primary"></i> تحقق من معادلة الميزانية
        </h3>
        <div id="bsContent" class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center"></div>
      </div>

      <!-- Loading skeleton -->
      <div id="loadingState" class="space-y-4">
        <div class="animate-pulse bg-gray-200 h-32 rounded-2xl"></div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="animate-pulse bg-gray-200 h-24 rounded-xl"></div>
          <div class="animate-pulse bg-gray-200 h-24 rounded-xl"></div>
          <div class="animate-pulse bg-gray-200 h-24 rounded-xl"></div>
          <div class="animate-pulse bg-gray-200 h-24 rounded-xl"></div>
        </div>
      </div>

      <!-- Error state -->
      <div id="errorState" class="hidden bg-red-50 border border-red-200 rounded-xl p-6 text-center">
        <i class="fa-solid fa-circle-exclamation text-red-500 text-4xl mb-3"></i>
        <p class="text-red-700 font-bold" id="errorMsg">حدث خطأ أثناء تشغيل الفحص</p>
        <button onclick="runHealthCheck()" class="mt-4 bg-red-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-700 transition">إعادة المحاولة</button>
      </div>

      <!-- Checks Grid -->
      <div id="checksGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden"></div>

      <!-- Last run timestamp -->
      <p id="lastRun" class="text-xs text-gray-400 text-center mt-6 hidden"></p>

    </main>
  </div>

  <script>
  // ── Icons/labels per check id ──────────────────────────────
  const CHECK_META = {
    unbalanced_journals:     { icon:'fa-balance-scale',         color:'text-red-600' },
    missing_mappings:        { icon:'fa-link-slash',            color:'text-red-600' },
    orphan_invoice_items:    { icon:'fa-file-circle-xmark',     color:'text-red-600' },
    orphan_allocations:      { icon:'fa-coins',                 color:'text-red-600' },
    closed_period_violations:{ icon:'fa-calendar-xmark',        color:'text-red-600' },
    taxes_no_account:        { icon:'fa-percent',               color:'text-yellow-600' },
    expenses_no_cost_center: { icon:'fa-receipt',               color:'text-yellow-600' },
    unreconciled_banks:      { icon:'fa-building-columns',      color:'text-yellow-600' },
    failed_auto_accounting:  { icon:'fa-robot',                 color:'text-red-600' },
    stale_approved_expenses: { icon:'fa-clock-rotate-left',     color:'text-yellow-600' },
  };

  const STATUS_BADGE = {
    healthy:  { cls:'badge-healthy',  label:'سليم',   icon:'fa-circle-check' },
    warning:  { cls:'badge-warning',  label:'تحذير',  icon:'fa-triangle-exclamation' },
    critical: { cls:'badge-critical', label:'حرج',    icon:'fa-circle-xmark' },
  };

  const OVERALL_CFG = {
    healthy:  { bannerCls:'banner-healthy',  icon:'fa-shield-check',  title:'النظام سليم',    sub:'جميع الفحوصات المحاسبية اجتازت بنجاح' },
    warning:  { bannerCls:'banner-warning',  icon:'fa-triangle-exclamation', title:'تحذيرات تستوجب المراجعة', sub:'بعض الفحوصات تحتاج انتباهاً' },
    critical: { bannerCls:'banner-critical', icon:'fa-circle-xmark',  title:'مشاكل حرجة مكتشفة', sub:'يجب معالجة هذه المشاكل فوراً' },
  };

  // Action links for each check
  const CHECK_LINKS = {
    unbalanced_journals:      '/nsp-control-8x4k/accounting-dashboard.html',
    missing_mappings:         '/nsp-control-8x4k/accounting-coa.html',
    orphan_invoice_items:     '/nsp-control-8x4k/invoices-payments.html',
    orphan_allocations:       '/nsp-control-8x4k/invoices-payments.html',
    closed_period_violations: '/nsp-control-8x4k/fiscal-periods.html',
    taxes_no_account:         '/nsp-control-8x4k/accounting-coa.html',
    expenses_no_cost_center:  '/nsp-control-8x4k/expenses.html',
    unreconciled_banks:       '/nsp-control-8x4k/bank-reconciliation.html',
    failed_auto_accounting:   '/nsp-control-8x4k/invoices-payments.html',
    stale_approved_expenses:  '/nsp-control-8x4k/expenses.html',
  };

  // ── Format helpers ──────────────────────────────────────────
  const fmt = n => new Intl.NumberFormat('ar-EG').format(n ?? 0);

  // ── Auth gate ───────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', async () => {
    if (!await adminCheckAuth()) return;
    runHealthCheck();
  });

  // ── Main health check runner ────────────────────────────────
  async function runHealthCheck() {
    setLoading(true);
    hideAll();

    try {
      // Run all RPCs in parallel (Phase R: added production status)
      const [healthRes, bsRes, prodRes] = await Promise.all([
        window.db.rpc('get_accounting_health'),
        window.db.rpc('get_balance_sheet_status'),
        window.db.rpc('get_production_status'),
      ]);

      if (healthRes.error) throw healthRes.error;

      const data = healthRes.data;

      if (!data.ok) throw new Error(data.error || 'RPC returned ok:false');

      renderBanner(data);
      renderChecks(data.checks);
      if (bsRes.data && bsRes.data.ok) renderBalanceSheet(bsRes.data);
      if (prodRes.data && !prodRes.data.error) renderProductionStatus(prodRes.data);
      showResults();

    } catch (err) {
      showError(err.message || 'خطأ غير معروف');
    } finally {
      setLoading(false);
    }
  }

  // ── Render production status (Phase R) ─────────────────────
  function renderProductionStatus(data) {
    const card = document.getElementById('prodStatusCard');
    const badge = document.getElementById('prodStatusBadge');
    const grid = document.getElementById('prodStatusGrid');
    const meta = document.getElementById('prodStatusMeta');
    if (!card) return;

    const tables = [
      ['leads',            'العملاء المحتملون'],
      ['customers',        'العملاء'],
      ['opportunities',    'الفرص'],
      ['quotations',       'عروض الأسعار'],
      ['itineraries',      'الجداول السياحية'],
      ['service_catalog',  'كتالوج الخدمات'],
      ['rate_plans',       'خطط الأسعار'],
      ['ai_conversations', 'محادثات AI'],
      ['ai_requests',      'طلبات AI'],
      ['ai_recommendations','توصيات AI'],
      ['ai_insights_cache','ذاكرة التخزين'],
      ['permission_matrix','صلاحيات النظام'],
    ];

    const allOk = tables.every(([k]) => data[`has_${k}`] === true);
    badge.textContent  = allOk ? '✓ جميع الوحدات جاهزة' : '⚠ بعض الوحدات مفقودة';
    badge.style.background = allOk ? '#d1fae5' : '#fef3c7';
    badge.style.color      = allOk ? '#065f46' : '#92400e';

    grid.innerHTML = tables.map(([k, label]) => {
      const ok = data[`has_${k}`] === true;
      return `<div class="flex items-center gap-1.5 ${ok ? 'text-green-600' : 'text-red-500'}">
        <i class="fa-solid ${ok ? 'fa-circle-check' : 'fa-circle-xmark'} text-xs"></i>
        <span>${label}</span>
      </div>`;
    }).join('');

    meta.textContent = `آخر migration: ${data.last_migration || '—'} · ${data.permission_count || 0} صلاحية مسجلة`;
    card.classList.remove('hidden');
  }

  // ── Render overall banner ───────────────────────────────────
  function renderBanner(data) {
    const cfg = OVERALL_CFG[data.overall] || OVERALL_CFG.critical;
    const banner = document.getElementById('overallBanner');

    banner.className = `rounded-2xl text-white p-6 mb-6 ${cfg.bannerCls}`;

    document.getElementById('bannerIcon').innerHTML     = `<i class="fa-solid ${cfg.icon} ${data.overall === 'critical' ? 'pulse-critical' : ''}"></i>`;
    document.getElementById('bannerTitle').textContent  = cfg.title;
    document.getElementById('bannerSub').textContent    = cfg.sub;
    document.getElementById('cntCritical').textContent  = data.critical_count;
    document.getElementById('cntWarning').textContent   = data.warning_count;
    document.getElementById('cntHealthy').textContent   = data.healthy_count;

    const ts = data.generated_at ? new Date(data.generated_at).toLocaleString('ar-EG') : '';
    document.getElementById('bannerTime').textContent   = `آخر فحص: ${ts}`;
    banner.classList.remove('hidden');
  }

  // ── Render individual check cards ──────────────────────────
  function renderChecks(checks) {
    const grid = document.getElementById('checksGrid');
    grid.innerHTML = '';

    // Sort: critical first, then warning, then healthy
    const order = { critical:0, warning:1, healthy:2 };
    checks.sort((a,b) => (order[a.status]??3) - (order[b.status]??3));

    checks.forEach(chk => {
      const meta   = CHECK_META[chk.id] || { icon:'fa-circle-info', color:'text-gray-500' };
      const badge  = STATUS_BADGE[chk.status] || STATUS_BADGE.healthy;
      const border = `check-${chk.status}`;
      const link   = CHECK_LINKS[chk.id] || '#';
      const isOk   = chk.status === 'healthy';

      const card = document.createElement('div');
      card.className = `bg-white rounded-xl shadow border border-gray-100 p-5 ${border} flex flex-col gap-3`;
      card.innerHTML = `
        <div class="flex items-start justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center flex-shrink-0">
              <i class="fa-solid ${meta.icon} ${meta.color}"></i>
            </div>
            <div>
              <p class="font-bold text-gray-800 text-sm leading-tight">${chk.name_ar}</p>
              <p class="text-xs text-gray-400">${chk.name_en}</p>
            </div>
          </div>
          <span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-bold ${badge.cls} flex-shrink-0">
            <i class="fa-solid ${badge.icon} text-xs"></i> ${badge.label}
          </span>
        </div>

        <p class="text-xs text-gray-500 leading-relaxed">${chk.description}</p>

        <div class="flex items-center justify-between mt-1">
          <div class="flex items-center gap-2">
            <span class="text-2xl font-bold ${chk.status === 'healthy' ? 'text-green-600' : chk.status === 'critical' ? 'text-red-600' : 'text-yellow-600'}">
              ${fmt(chk.count)}
            </span>
            <span class="text-xs text-gray-400">${chk.count === 1 ? 'مشكلة' : 'مشاكل'}</span>
          </div>
          ${!isOk ? `
          <a href="${link}" class="text-xs text-primary hover:underline flex items-center gap-1">
            مراجعة <i class="fa-solid fa-arrow-left text-xs"></i>
          </a>` : `<span class="text-xs text-green-600"><i class="fa-solid fa-check"></i> لا توجد مشاكل</span>`}
        </div>
      `;
      grid.appendChild(card);
    });

    grid.classList.remove('hidden');
  }

  // ── Render balance sheet integrity ─────────────────────────
  function renderBalanceSheet(bs) {
    const card    = document.getElementById('bsCard');
    const content = document.getElementById('bsContent');
    const isOk    = bs.is_balanced;

    content.innerHTML = `
      <div class="bg-gray-50 rounded-lg p-3">
        <p class="text-xs text-gray-400 mb-1">إجمالي الأصول</p>
        <p class="text-lg font-bold text-blue-700">${fmt(bs.total_assets)}</p>
      </div>
      <div class="bg-gray-50 rounded-lg p-3">
        <p class="text-xs text-gray-400 mb-1">إجمالي الخصوم</p>
        <p class="text-lg font-bold text-orange-600">${fmt(bs.total_liabilities)}</p>
      </div>
      <div class="bg-gray-50 rounded-lg p-3">
        <p class="text-xs text-gray-400 mb-1">حقوق الملكية</p>
        <p class="text-lg font-bold text-purple-600">${fmt(bs.total_equity)}</p>
      </div>
      <div class="rounded-lg p-3 ${isOk ? 'bg-green-50' : 'bg-red-50'}">
        <p class="text-xs text-gray-400 mb-1">الفرق</p>
        <p class="text-lg font-bold ${isOk ? 'text-green-700' : 'text-red-700'}">${fmt(bs.difference)}</p>
        <p class="text-xs mt-1 font-semibold ${isOk ? 'text-green-600' : 'text-red-600'}">
          <i class="fa-solid ${isOk ? 'fa-check' : 'fa-xmark'}"></i>
          ${isOk ? 'الميزانية متوازنة' : 'الميزانية غير متوازنة!'}
        </p>
      </div>
    `;
    card.classList.remove('hidden');
  }

  // ── UI state helpers ────────────────────────────────────────
  function setLoading(on) {
    const btn  = document.getElementById('refreshBtn');
    const icon = document.getElementById('refreshIcon');
    if (on) {
      btn.disabled  = true;
      btn.classList.add('opacity-70', 'cursor-not-allowed');
      icon.classList.add('spin');
      document.getElementById('loadingState').classList.remove('hidden');
    } else {
      btn.disabled  = false;
      btn.classList.remove('opacity-70', 'cursor-not-allowed');
      icon.classList.remove('spin');
      document.getElementById('loadingState').classList.add('hidden');
    }
  }

  function hideAll() {
    ['overallBanner','bsCard','checksGrid','errorState','lastRun','prodStatusCard']
      .forEach(id => document.getElementById(id).classList.add('hidden'));
  }

  function showResults() {
    const now = new Date().toLocaleString('ar-EG');
    const lr  = document.getElementById('lastRun');
    lr.textContent = `آخر تحديث: ${now}`;
    lr.classList.remove('hidden');
    document.getElementById('errorState').classList.add('hidden');
  }

  function showError(msg) {
    document.getElementById('errorMsg').textContent = msg || 'حدث خطأ أثناء تشغيل الفحص';
    document.getElementById('errorState').classList.remove('hidden');
    document.getElementById('loadingState').classList.add('hidden');
  }
  </script>
</div><!-- /flex wrapper -->
</body>
</html>
