<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الشركاء B2B | نيو سي برنسيس</title>
  <script>tailwind={config:{theme:{extend:{colors:{primary:"#1B5E20",lightGreen:"#2E7D32",gold:"#B8860B",lightGold:"#DAA520",darkBg:"#0D1B0E",offWhite:"#F8F5EC",borderGold:"#D4AF6A",success:"#2E7D32",warning:"#F57F17",error:"#C62828"},fontFamily:{sans:["Cairo","sans-serif"]}}}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/custom.css">
  <link rel="stylesheet" href="/css/erp-ui.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js"></script>
  <script src="/js/admin.js"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .badge { display:inline-flex;align-items:center;padding:2px 10px;border-radius:9999px;font-size:.72rem;font-weight:700; }
    .badge-strategic { background:#fdf4ff;color:#7e22ce; }
    .badge-platinum  { background:#f0f9ff;color:#0369a1; }
    .badge-gold      { background:#fefce8;color:#92400e; }
    .badge-silver    { background:#f3f4f6;color:#374151; }
    .badge-standard  { background:#f3f4f6;color:#6b7280; }
    .badge-new       { background:#ecfdf5;color:#065f46; }
    .badge-active    { background:#dcfce7;color:#166534; }
    .badge-inactive  { background:#fee2e2;color:#991b1b; }
    .partner-card { border-radius:12px;border:1px solid #e5e7eb;padding:16px;background:#fff;transition:box-shadow .2s; }
    .partner-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.08); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div id="adminNavMount"></div>
<main class="flex-1 overflow-auto p-4 md:p-6">

  <!-- Header -->
  <div class="erp-page-header">
    <div>
      <h1 class="erp-page-title"><i class="fa-solid fa-building ml-2 text-primary"></i>الشركاء B2B</h1>
      <p class="text-sm text-gray-500 mt-0.5">إدارة وكالات السفر والموزعين والشركاء التجاريين</p>
    </div>
    <div class="flex gap-2 flex-wrap">
      <button onclick="openModal()" class="erp-page-btn bg-primary text-white hover:bg-lightGreen border-transparent">
        <i class="fa-solid fa-plus ml-1"></i>شريك جديد
      </button>
    </div>
  </div>

  <!-- Stats row -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="erp-card p-4 text-center">
      <p class="text-2xl font-black text-primary" id="statTotal">—</p>
      <p class="text-xs text-gray-500 mt-0.5">إجمالي الشركاء</p>
    </div>
    <div class="erp-card p-4 text-center">
      <p class="text-2xl font-black text-green-600" id="statActive">—</p>
      <p class="text-xs text-gray-500 mt-0.5">نشط</p>
    </div>
    <div class="erp-card p-4 text-center">
      <p class="text-2xl font-black text-amber-600" id="statExpiring">—</p>
      <p class="text-xs text-gray-500 mt-0.5">عقود تنتهي قريباً</p>
    </div>
    <div class="erp-card p-4 text-center">
      <p class="text-2xl font-black text-purple-600" id="statStrategic">—</p>
      <p class="text-xs text-gray-500 mt-0.5">شراكات استراتيجية</p>
    </div>
  </div>

  <!-- Filters -->
  <div class="erp-card p-4 mb-4 flex flex-wrap gap-3 items-center">
    <input id="searchInput" oninput="filterPartners()" type="text"
      placeholder="بحث بالاسم أو البلد أو النوع…"
      class="border border-gray-200 rounded-lg px-3 py-2 text-sm flex-1 min-w-[180px] focus:outline-none focus:border-primary">
    <select id="filterType" onchange="filterPartners()" class="border border-gray-200 rounded-lg px-3 py-2 text-sm">
      <option value="">كل الأنواع</option>
      <option value="agency">وكالة سفر</option>
      <option value="operator">مشغل سياحي</option>
      <option value="wholesaler">موزع</option>
      <option value="dmc">DMC</option>
      <option value="corporate">شركة</option>
      <option value="ota">OTA</option>
      <option value="representative">ممثل</option>
      <option value="other">أخرى</option>
    </select>
    <select id="filterTier" onchange="filterPartners()" class="border border-gray-200 rounded-lg px-3 py-2 text-sm">
      <option value="">كل الدرجات</option>
      <option value="strategic">استراتيجي</option>
      <option value="platinum">بلاتينيوم</option>
      <option value="gold">ذهبي</option>
      <option value="silver">فضي</option>
      <option value="standard">عادي</option>
      <option value="new">جديد</option>
    </select>
    <select id="filterActive" onchange="filterPartners()" class="border border-gray-200 rounded-lg px-3 py-2 text-sm">
      <option value="">الكل</option>
      <option value="true">نشط فقط</option>
      <option value="false">غير نشط</option>
    </select>
  </div>

  <!-- Partner grid -->
  <div id="partnerGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
  <p id="emptyState" class="hidden text-center text-gray-400 py-16 text-sm">لا يوجد شركاء مطابقون</p>

</main>

<!-- ═══════════════════════ PARTNER MODAL ═══════════════════════ -->
<div id="partnerModal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-start justify-center p-4 overflow-y-auto">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl mt-8 mb-8">

    <div class="flex items-center justify-between px-6 py-4 border-b">
      <h2 class="font-black text-gray-800 text-lg" id="modalTitle">شريك جديد</h2>
      <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Tabs -->
    <div class="flex border-b px-6 gap-4">
      <button onclick="switchTab('info')"    id="tab-info"     class="tab-btn py-3 text-sm font-bold border-b-2 border-primary text-primary">معلومات أساسية</button>
      <button onclick="switchTab('contact')" id="tab-contact"  class="tab-btn py-3 text-sm font-bold border-b-2 border-transparent text-gray-500">جهات الاتصال</button>
      <button onclick="switchTab('rates')"   id="tab-rates"    class="tab-btn py-3 text-sm font-bold border-b-2 border-transparent text-gray-500">الأسعار</button>
    </div>

    <!-- Tab: Info -->
    <div id="tabInfo" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="md:col-span-2">
        <label class="block text-xs font-bold text-gray-600 mb-1">الاسم القانوني <span class="text-red-500">*</span></label>
        <input id="fLegalName" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary" placeholder="Legal Trading Co.">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">الاسم التجاري</label>
        <input id="fTradingName" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary" placeholder="اسم مختصر">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">نوع الشريك</label>
        <select id="fType" class="w-full border rounded-lg px-3 py-2 text-sm">
          <option value="agency">وكالة سفر</option>
          <option value="operator">مشغل سياحي</option>
          <option value="wholesaler">موزع</option>
          <option value="dmc">DMC</option>
          <option value="corporate">شركة</option>
          <option value="ota">OTA</option>
          <option value="representative">ممثل دولي</option>
          <option value="other">أخرى</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">الدرجة</label>
        <select id="fTier" class="w-full border rounded-lg px-3 py-2 text-sm">
          <option value="new">جديد</option>
          <option value="standard" selected>عادي</option>
          <option value="silver">فضي</option>
          <option value="gold">ذهبي</option>
          <option value="platinum">بلاتينيوم</option>
          <option value="strategic">استراتيجي</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">الدولة</label>
        <input id="fCountry" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary" placeholder="مصر">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">المدينة</label>
        <input id="fCity" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary" placeholder="القاهرة">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">الموقع الإلكتروني</label>
        <input id="fWebsite" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary" placeholder="https://...">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">البريد الإلكتروني</label>
        <input id="fEmail" type="email" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">الهاتف</label>
        <input id="fPhone" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">واتساب</label>
        <input id="fWhatsapp" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">العملة</label>
        <select id="fCurrency" class="w-full border rounded-lg px-3 py-2 text-sm">
          <option value="EGP">EGP</option><option value="USD">USD</option>
          <option value="EUR">EUR</option><option value="SAR">SAR</option>
          <option value="AED">AED</option><option value="GBP">GBP</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">حد الائتمان</label>
        <input id="fCreditLimit" type="number" min="0" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary" placeholder="0">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">مدة السداد (يوم)</label>
        <input id="fPaymentTerms" type="number" min="0" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary" placeholder="30">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">خطة التسعير</label>
        <select id="fRatePlan" class="w-full border rounded-lg px-3 py-2 text-sm">
          <option value="">— اختر خطة —</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">حالة العقد</label>
        <select id="fContractStatus" class="w-full border rounded-lg px-3 py-2 text-sm">
          <option value="none">لا يوجد</option>
          <option value="draft">مسودة</option>
          <option value="active">ساري</option>
          <option value="expired">منتهي</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">انتهاء العقد</label>
        <input id="fContractExpiry" type="date" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-600 mb-1">الحالة</label>
        <select id="fActive" class="w-full border rounded-lg px-3 py-2 text-sm">
          <option value="true">نشط</option>
          <option value="false">غير نشط</option>
        </select>
      </div>
      <div class="md:col-span-2">
        <label class="block text-xs font-bold text-gray-600 mb-1">ملاحظات</label>
        <textarea id="fNotes" rows="3" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary resize-none"></textarea>
      </div>
    </div>

    <!-- Tab: Contacts -->
    <div id="tabContact" class="hidden p-6">
      <div id="contactsContainer" class="space-y-3"></div>
      <button onclick="addContact()" class="mt-3 text-sm text-primary font-bold flex items-center gap-1 hover:underline">
        <i class="fa-solid fa-plus"></i> إضافة جهة اتصال
      </button>
    </div>

    <!-- Tab: Rate overrides -->
    <div id="tabRates" class="hidden p-6">
      <p class="text-xs text-gray-500 mb-4">تجاوزات السعر الخاصة بهذا الشريك (تُطبَّق فوق خطة التسعير الأساسية)</p>
      <div id="ratesContainer" class="space-y-3"></div>
      <button onclick="addRateOverride()" class="mt-3 text-sm text-primary font-bold flex items-center gap-1 hover:underline">
        <i class="fa-solid fa-plus"></i> إضافة تجاوز سعر
      </button>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-between px-6 py-4 border-t bg-gray-50 rounded-b-2xl">
      <button onclick="deletePartner()" id="btnDelete" class="hidden text-red-500 hover:text-red-700 text-sm font-bold">
        <i class="fa-solid fa-trash ml-1"></i>حذف
      </button>
      <div class="flex gap-2 mr-auto">
        <button onclick="closeModal()" class="erp-page-btn">إلغاء</button>
        <button onclick="save()" id="btnSave"
          class="erp-page-btn bg-primary text-white hover:bg-lightGreen border-transparent">
          <i class="fa-solid fa-floppy-disk ml-1"></i>حفظ
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 hidden z-50 px-5 py-3 rounded-xl shadow-xl text-sm font-bold text-white transition-all"></div>

<script src="/js/admin-nav.js"></script>
<script>
const db = window.db;
let allPartners = [], ratePlans = [], editId = null, partnerContacts = [], partnerRateOverrides = [];

const TIER_LABEL = { strategic:'استراتيجي', platinum:'بلاتينيوم', gold:'ذهبي', silver:'فضي', standard:'عادي', new:'جديد' };
const TYPE_LABEL = { agency:'وكالة سفر', operator:'مشغل سياحي', wholesaler:'موزع', dmc:'DMC', corporate:'شركة', ota:'OTA', representative:'ممثل', other:'أخرى' };
const CAT_LABEL  = { hotel:'فندق', transfer:'نقل', guide:'مرشد', activity:'نشاط', ticket:'تذكرة', meal:'وجبة', flight:'طيران', visa:'تأشيرة', insurance:'تأمين', transport:'مركبات', camp:'مخيم', other:'أخرى', all:'الكل' };

function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-xl shadow-xl text-sm font-bold text-white ${ok ? 'bg-green-600' : 'bg-red-500'}`;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 3000);
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!await adminCheckAuth()) return;
  NSPNav.init();
  await loadAll();
});

async function loadAll() {
  const [{ data: partners }, { data: plans }] = await Promise.all([
    db.from('b2b_partners')
      .select('*, rate_plans(name_ar,code)')
      .order('created_at', { ascending: false }),
    db.from('rate_plans').select('id,name_ar,code').eq('is_active', true).order('name_ar'),
  ]);

  allPartners = partners || [];
  ratePlans   = plans   || [];

  // Populate rate plan dropdown
  const sel = document.getElementById('fRatePlan');
  sel.innerHTML = '<option value="">— اختر خطة —</option>' +
    ratePlans.map(p => `<option value="${p.id}">${p.name_ar} (${p.code})</option>`).join('');

  updateStats();
  filterPartners();
}

function updateStats() {
  document.getElementById('statTotal').textContent     = allPartners.length;
  document.getElementById('statActive').textContent    = allPartners.filter(p => p.is_active).length;
  document.getElementById('statStrategic').textContent = allPartners.filter(p => p.tier === 'strategic').length;
  // Expiring contracts (next 60 days)
  const soon = new Date(); soon.setDate(soon.getDate() + 60);
  document.getElementById('statExpiring').textContent  = allPartners.filter(p =>
    p.contract_expiry && new Date(p.contract_expiry) <= soon && p.contract_status === 'active'
  ).length;
}

function filterPartners() {
  const q    = document.getElementById('searchInput').value.toLowerCase();
  const type = document.getElementById('filterType').value;
  const tier = document.getElementById('filterTier').value;
  const act  = document.getElementById('filterActive').value;

  const filtered = allPartners.filter(p =>
    (!q    || [p.legal_name, p.trading_name, p.country, p.city].some(v => v?.toLowerCase().includes(q))) &&
    (!type || p.partner_type === type) &&
    (!tier || p.tier === tier) &&
    (act === '' || String(p.is_active) === act)
  );

  renderGrid(filtered);
}

function renderGrid(list) {
  const grid  = document.getElementById('partnerGrid');
  const empty = document.getElementById('emptyState');
  if (!list.length) { grid.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');

  const contractWarning = (p) => {
    if (!p.contract_expiry) return '';
    const days = Math.ceil((new Date(p.contract_expiry) - new Date()) / 86400000);
    if (days < 0)  return `<p class="text-xs text-red-500 mt-1"><i class="fa-solid fa-circle-exclamation ml-1"></i>العقد منتهي</p>`;
    if (days < 60) return `<p class="text-xs text-amber-600 mt-1"><i class="fa-solid fa-triangle-exclamation ml-1"></i>ينتهي خلال ${days} يوم</p>`;
    return '';
  };

  grid.innerHTML = list.map(p => `
    <div class="partner-card cursor-pointer" onclick="openEdit('${p.id}')">
      <div class="flex items-start justify-between mb-2">
        <div class="flex-1 min-w-0">
          <p class="font-black text-gray-800 truncate">${p.legal_name}</p>
          ${p.trading_name ? `<p class="text-xs text-gray-500">${p.trading_name}</p>` : ''}
        </div>
        <div class="flex gap-1 flex-shrink-0 mr-2">
          <span class="badge badge-${p.tier}">${TIER_LABEL[p.tier] || p.tier}</span>
          <span class="badge badge-${p.is_active ? 'active' : 'inactive'}">${p.is_active ? 'نشط' : 'غير نشط'}</span>
        </div>
      </div>
      <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-gray-500 mb-2">
        <span><i class="fa-solid fa-building-columns ml-1"></i>${TYPE_LABEL[p.partner_type] || p.partner_type}</span>
        ${p.country ? `<span><i class="fa-solid fa-location-dot ml-1"></i>${p.country}${p.city ? ' · ' + p.city : ''}</span>` : ''}
        ${p.currency ? `<span><i class="fa-solid fa-coins ml-1"></i>${p.currency}</span>` : ''}
        ${p.rate_plans ? `<span><i class="fa-solid fa-tags ml-1 text-primary"></i>${p.rate_plans.name_ar}</span>` : ''}
      </div>
      ${p.email ? `<p class="text-xs text-gray-400"><i class="fa-solid fa-envelope ml-1"></i>${p.email}</p>` : ''}
      ${p.phone ? `<p class="text-xs text-gray-400"><i class="fa-solid fa-phone ml-1"></i>${p.phone}</p>` : ''}
      ${contractWarning(p)}
    </div>
  `).join('');
}

// ── Modal ──────────────────────────────────────────────────────────────────
function openModal() {
  editId = null;
  partnerContacts = []; partnerRateOverrides = [];
  document.getElementById('modalTitle').textContent = 'شريك جديد';
  document.getElementById('btnDelete').classList.add('hidden');
  clearForm();
  switchTab('info');
  document.getElementById('partnerModal').classList.remove('hidden');
}

async function openEdit(id) {
  editId = id;
  const p = allPartners.find(x => x.id === id);
  if (!p) return;

  document.getElementById('modalTitle').textContent = p.legal_name;
  document.getElementById('btnDelete').classList.remove('hidden');

  // Fill form
  document.getElementById('fLegalName').value      = p.legal_name || '';
  document.getElementById('fTradingName').value    = p.trading_name || '';
  document.getElementById('fType').value           = p.partner_type || 'agency';
  document.getElementById('fTier').value           = p.tier || 'standard';
  document.getElementById('fCountry').value        = p.country || '';
  document.getElementById('fCity').value           = p.city || '';
  document.getElementById('fWebsite').value        = p.website || '';
  document.getElementById('fEmail').value          = p.email || '';
  document.getElementById('fPhone').value          = p.phone || '';
  document.getElementById('fWhatsapp').value       = p.whatsapp || '';
  document.getElementById('fCurrency').value       = p.currency || 'EGP';
  document.getElementById('fCreditLimit').value    = p.credit_limit || 0;
  document.getElementById('fPaymentTerms').value   = p.payment_terms_days || 30;
  document.getElementById('fRatePlan').value       = p.rate_plan_id || '';
  document.getElementById('fContractStatus').value = p.contract_status || 'none';
  document.getElementById('fContractExpiry').value = p.contract_expiry || '';
  document.getElementById('fActive').value         = String(p.is_active);
  document.getElementById('fNotes').value          = p.notes || '';

  // Load contacts and rate overrides
  const [{ data: contacts }, { data: rates }] = await Promise.all([
    db.from('partner_contacts').select('*').eq('partner_id', id).order('created_at'),
    db.from('partner_rates').select('*').eq('partner_id', id).order('created_at'),
  ]);
  partnerContacts = contacts || [];
  partnerRateOverrides = rates || [];
  renderContacts();
  renderRateOverrides();

  switchTab('info');
  document.getElementById('partnerModal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('partnerModal').classList.add('hidden');
  editId = null;
}

function clearForm() {
  ['fLegalName','fTradingName','fCountry','fCity','fWebsite','fEmail','fPhone','fWhatsapp','fNotes'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('fType').value           = 'agency';
  document.getElementById('fTier').value           = 'standard';
  document.getElementById('fCurrency').value       = 'EGP';
  document.getElementById('fCreditLimit').value    = 0;
  document.getElementById('fPaymentTerms').value   = 30;
  document.getElementById('fRatePlan').value       = '';
  document.getElementById('fContractStatus').value = 'none';
  document.getElementById('fContractExpiry').value = '';
  document.getElementById('fActive').value         = 'true';
  document.getElementById('contactsContainer').innerHTML = '';
  document.getElementById('ratesContainer').innerHTML    = '';
}

function switchTab(tab) {
  ['info','contact','rates'].forEach(t => {
    document.getElementById('tab-' + t).className =
      `tab-btn py-3 text-sm font-bold border-b-2 ${t === tab
        ? 'border-primary text-primary'
        : 'border-transparent text-gray-500'}`;
    document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('hidden', t !== tab);
  });
}

// ── Save ────────────────────────────────────────────────────────────────────
async function save() {
  const legalName = document.getElementById('fLegalName').value.trim();
  if (!legalName) { toast('الاسم القانوني مطلوب', false); return; }

  const btn = document.getElementById('btnSave');
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin ml-1"></i>جارٍ الحفظ…';

  const { data: session } = await db.auth.getSession();
  const payload = {
    legal_name:         legalName,
    trading_name:       document.getElementById('fTradingName').value.trim() || null,
    partner_type:       document.getElementById('fType').value,
    tier:               document.getElementById('fTier').value,
    country:            document.getElementById('fCountry').value.trim() || null,
    city:               document.getElementById('fCity').value.trim() || null,
    website:            document.getElementById('fWebsite').value.trim() || null,
    email:              document.getElementById('fEmail').value.trim() || null,
    phone:              document.getElementById('fPhone').value.trim() || null,
    whatsapp:           document.getElementById('fWhatsapp').value.trim() || null,
    currency:           document.getElementById('fCurrency').value,
    credit_limit:       parseFloat(document.getElementById('fCreditLimit').value) || 0,
    payment_terms_days: parseInt(document.getElementById('fPaymentTerms').value) || 30,
    rate_plan_id:       document.getElementById('fRatePlan').value || null,
    contract_status:    document.getElementById('fContractStatus').value,
    contract_expiry:    document.getElementById('fContractExpiry').value || null,
    is_active:          document.getElementById('fActive').value === 'true',
    notes:              document.getElementById('fNotes').value.trim() || null,
  };

  try {
    let savedId = editId;
    if (editId) {
      const { error } = await db.from('b2b_partners').update(payload).eq('id', editId);
      if (error) throw error;
    } else {
      payload.created_by = session?.session?.user?.id;
      const { data: saved, error } = await db.from('b2b_partners').insert(payload).select('id').single();
      if (error) throw error;
      savedId = saved.id;
    }

    // Save contacts: delete removed ones, upsert existing + new
    const existingIds = partnerContacts.filter(c => c.id && !c._new).map(c => c.id);
    // Delete contacts that were removed from the list (only on edit)
    if (editId) {
      const { data: savedContacts } = await db.from('partner_contacts')
        .select('id').eq('partner_id', savedId);
      const toDelete = (savedContacts || []).filter(c => !existingIds.includes(c.id));
      for (const c of toDelete) {
        await db.from('partner_contacts').delete().eq('id', c.id);
      }
    }
    for (const c of partnerContacts) {
      if (c._new) {
        delete c._new;
        c.partner_id = savedId;
        const { full_name, role, email, phone, whatsapp, is_primary, partner_id } = c;
        await db.from('partner_contacts').insert({ full_name, role, email, phone, whatsapp, is_primary, partner_id });
      }
    }

    // Save pending rate overrides
    for (const r of partnerRateOverrides) {
      if (r._new) {
        delete r._new;
        r.partner_id  = savedId;
        r.created_by  = session?.session?.user?.id;
        await db.from('partner_rates').insert(r);
      }
    }

    toast(editId ? 'تم تحديث الشريك' : 'تم إنشاء الشريك الجديد');
    closeModal();
    await loadAll();
  } catch (e) {
    toast('خطأ: ' + e.message, false);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-floppy-disk ml-1"></i>حفظ';
  }
}

async function deletePartner() {
  if (!editId) return;
  const p = allPartners.find(x => x.id === editId);
  if (!confirm(`حذف الشريك "${p?.legal_name}"؟ سيتم حذف جميع جهات الاتصال وتجاوزات الأسعار.`)) return;
  const { error } = await db.from('b2b_partners').delete().eq('id', editId);
  if (error) { toast('خطأ: ' + error.message, false); return; }
  toast('تم حذف الشريك');
  closeModal();
  await loadAll();
}

// ── Contacts ────────────────────────────────────────────────────────────────
function addContact() {
  partnerContacts.push({ _new: true, role: 'general', full_name: '', email: '', phone: '', is_primary: false });
  renderContacts();
}

function renderContacts() {
  const el = document.getElementById('contactsContainer');
  if (!partnerContacts.length) {
    el.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">لا توجد جهات اتصال — أضف جهة اتصال</p>';
    return;
  }
  el.innerHTML = partnerContacts.map((c, i) => `
    <div class="border rounded-lg p-3 bg-gray-50 flex flex-col gap-2">
      <div class="flex gap-2">
        <input value="${c.full_name || ''}" oninput="partnerContacts[${i}].full_name=this.value"
          class="flex-1 border rounded px-2 py-1.5 text-sm" placeholder="الاسم الكامل *">
        <select onchange="partnerContacts[${i}].role=this.value"
          class="border rounded px-2 py-1.5 text-sm">
          ${['general','sales','operations','finance','emergency'].map(r =>
            `<option value="${r}" ${c.role===r?'selected':''}>${{general:'عام',sales:'مبيعات',operations:'عمليات',finance:'مالي',emergency:'طوارئ'}[r]}</option>`
          ).join('')}
        </select>
        ${c.id
          ? `<button onclick="deleteExistingContact('${c.id}', this)" class="text-red-400 hover:text-red-600 px-2"><i class="fa-solid fa-trash text-xs"></i></button>`
          : `<button onclick="removeContact(${i})" class="text-red-400 hover:text-red-600 px-2"><i class="fa-solid fa-xmark text-xs"></i></button>`
        }
      </div>
      <div class="flex gap-2">
        <input value="${c.email || ''}" oninput="partnerContacts[${i}].email=this.value"
          class="flex-1 border rounded px-2 py-1.5 text-sm" placeholder="البريد الإلكتروني">
        <input value="${c.phone || ''}" oninput="partnerContacts[${i}].phone=this.value"
          class="flex-1 border rounded px-2 py-1.5 text-sm" placeholder="الهاتف">
      </div>
    </div>
  `).join('');
}

function removeContact(i) {
  partnerContacts.splice(i, 1);
  renderContacts();
}

async function deleteExistingContact(id, btn) {
  if (!confirm('حذف جهة الاتصال هذه؟')) return;
  const { error } = await db.from('partner_contacts').delete().eq('id', id);
  if (error) { alert('خطأ: ' + error.message); return; }
  partnerContacts = partnerContacts.filter(c => c.id !== id);
  renderContacts();
}

// ── Rate overrides ──────────────────────────────────────────────────────────
function addRateOverride() {
  partnerRateOverrides.push({
    _new: true, service_category: 'all',
    override_type: 'discount_pct', override_value: 0,
    valid_from: null, valid_to: null, is_active: true
  });
  renderRateOverrides();
}

function renderRateOverrides() {
  const el = document.getElementById('ratesContainer');
  if (!partnerRateOverrides.length) {
    el.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">لا توجد تجاوزات — يستخدم الشريك خطة التسعير الأساسية</p>';
    return;
  }
  const OT = { discount_pct:'خصم %', net_rate:'سعر صافي', markup_pct:'إضافة %', commission_pct:'عمولة %' };
  el.innerHTML = partnerRateOverrides.map((r, i) => `
    <div class="border rounded-lg p-3 bg-gray-50 flex flex-col gap-2">
      <div class="flex gap-2 items-center">
        <select onchange="partnerRateOverrides[${i}].service_category=this.value" class="border rounded px-2 py-1.5 text-sm flex-1">
          ${Object.entries(CAT_LABEL).map(([v,l]) => `<option value="${v}" ${r.service_category===v?'selected':''}>${l}</option>`).join('')}
        </select>
        <select onchange="partnerRateOverrides[${i}].override_type=this.value" class="border rounded px-2 py-1.5 text-sm flex-1">
          ${Object.entries(OT).map(([v,l]) => `<option value="${v}" ${r.override_type===v?'selected':''}>${l}</option>`).join('')}
        </select>
        <input type="number" min="0" value="${r.override_value || 0}"
          oninput="partnerRateOverrides[${i}].override_value=parseFloat(this.value)||0"
          class="w-24 border rounded px-2 py-1.5 text-sm text-center">
        <button onclick="removeRateOverride(${i})" class="text-red-400 hover:text-red-600 px-2">
          <i class="fa-solid fa-trash text-xs"></i>
        </button>
      </div>
      <div class="flex gap-2">
        <input type="date" value="${r.valid_from || ''}" oninput="partnerRateOverrides[${i}].valid_from=this.value||null"
          class="border rounded px-2 py-1.5 text-xs flex-1" placeholder="من">
        <input type="date" value="${r.valid_to || ''}" oninput="partnerRateOverrides[${i}].valid_to=this.value||null"
          class="border rounded px-2 py-1.5 text-xs flex-1" placeholder="إلى">
      </div>
    </div>
  `).join('');
}

function removeRateOverride(i) {
  partnerRateOverrides.splice(i, 1);
  renderRateOverrides();
}
</script>
