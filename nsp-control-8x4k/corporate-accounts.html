<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حسابات الشركات | نيو سي برنسيس</title>
  <script>tailwind={config:{theme:{extend:{colors:{primary:"#1B5E20",lightGreen:"#2E7D32",gold:"#B8860B"},fontFamily:{sans:["Cairo","sans-serif"]}}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/custom.css"><link rel="stylesheet" href="/css/erp-ui.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js"></script><script src="/js/admin.js"></script><script src="/js/admin-nav.js"></script>
  <style>
    body{font-family:'Cairo',sans-serif;}
    label{font-size:12px;font-weight:700;color:#374151;display:block;margin-bottom:3px;}
    input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:8px 11px;font-family:'Cairo',sans-serif;font-size:13px;outline:none;background:#fff;}
    input:focus,select:focus{border-color:#1B5E20;box-shadow:0 0 0 2px rgba(27,94,32,.1);}
    .tbl th{background:#f9fafb;font-size:11px;font-weight:700;color:#374151;padding:9px 12px;text-align:right;border-bottom:2px solid #e5e7eb;}
    .tbl td{padding:9px 12px;font-size:13px;border-bottom:1px solid #f3f4f6;vertical-align:middle;}
    .tbl tr:hover td{background:#fafafa;}
    .tab-btn{padding:7px 16px;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;border:none;transition:.15s;}
    .tab-btn.active{background:#1B5E20;color:#fff;}
    .tab-btn:not(.active){background:#f3f4f6;color:#374151;}
    .tab-panel{display:none;}.tab-panel.active{display:block;}
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1B5E20;color:#fff;padding:10px 24px;border-radius:24px;font-size:.85rem;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;}
    #toast.show{opacity:1;}
    .info-row{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #f3f4f6;font-size:.875rem;}
    .info-label{color:#9ca3af;width:150px;flex-shrink:0;font-size:.78rem;}
    .info-val{color:#1f2937;font-weight:600;flex:1;}
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div id="adminNavMount"></div>
<main class="flex-1 overflow-auto p-4 md:p-6">

  <div class="erp-page-header mb-5">
    <div>
      <h1 class="erp-page-title"><i class="fa-solid fa-building ml-2 text-primary"></i>حسابات الشركات</h1>
      <p class="erp-page-subtitle" id="pageSubtitle">Corporate Travel Accounts</p>
    </div>
    <button onclick="openNew()" class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-lightGreen transition">
      <i class="fa-solid fa-plus ml-1"></i>شركة جديدة
    </button>
  </div>

  <!-- KPIs -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5" id="kpiStrip">
    <div class="erp-card p-4 text-center animate-pulse border-b-2 border-primary"><div class="h-6 bg-gray-100 rounded w-10 mx-auto mb-1"></div><div class="h-3 bg-gray-100 rounded w-16 mx-auto"></div></div>
    <div class="erp-card p-4 text-center animate-pulse border-b-2 border-blue-400"><div class="h-6 bg-gray-100 rounded w-10 mx-auto mb-1"></div><div class="h-3 bg-gray-100 rounded w-16 mx-auto"></div></div>
    <div class="erp-card p-4 text-center animate-pulse border-b-2 border-green-400"><div class="h-6 bg-gray-100 rounded w-10 mx-auto mb-1"></div><div class="h-3 bg-gray-100 rounded w-16 mx-auto"></div></div>
    <div class="erp-card p-4 text-center animate-pulse border-b-2 border-amber-400"><div class="h-6 bg-gray-100 rounded w-10 mx-auto mb-1"></div><div class="h-3 bg-gray-100 rounded w-16 mx-auto"></div></div>
  </div>

  <!-- Search + Table -->
  <div class="flex gap-2 mb-3">
    <input type="text" id="search" placeholder="بحث بالاسم أو الكود…" class="border border-gray-200 rounded-lg px-3 py-1.5 text-sm flex-1 max-w-xs" oninput="render()">
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <!-- List -->
    <div class="erp-card overflow-x-auto">
      <table class="w-full tbl">
        <thead><tr><th>الكود</th><th>اسم الشركة</th><th>القطاع</th><th>الدولة</th><th>الحد الائتماني</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="5" class="text-center py-10 text-gray-400 animate-pulse">جارٍ التحميل…</td></tr></tbody>
      </table>
    </div>

    <!-- Detail Panel -->
    <div class="lg:col-span-2" id="detailPanel">
      <div class="erp-card p-8 text-center text-gray-400">
        <i class="fa-solid fa-hand-pointer text-4xl mb-3 block text-gray-200"></i>
        <p>اختر شركة لعرض تفاصيلها</p>
      </div>
    </div>
  </div>

</main>
<div id="toast"></div>

<!-- Travel Requests Drawer -->
<div id="reqDrawer" class="hidden fixed inset-0 z-50 flex">
  <div class="flex-1 bg-black/40" onclick="closeRequests()"></div>
  <div class="bg-white w-full max-w-2xl flex flex-col shadow-2xl">
    <div class="flex items-center justify-between p-5 border-b sticky top-0 bg-white">
      <div>
        <h3 class="font-bold text-lg text-primary"><i class="fa-solid fa-plane ml-2"></i>طلبات السفر الوظيفي</h3>
        <p class="text-xs text-gray-400" id="reqSubtitle"></p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openAddRequest()" class="bg-primary text-white text-xs font-bold px-3 py-2 rounded-lg hover:bg-lightGreen transition">
          <i class="fa-solid fa-plus ml-1"></i>طلب جديد
        </button>
        <button onclick="closeRequests()" class="text-gray-400 hover:text-red-500 text-xl w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-times"></i></button>
      </div>
    </div>
    <!-- Status filter -->
    <div class="flex gap-2 px-5 py-3 border-b bg-gray-50 overflow-x-auto">
      <button onclick="setRF('all',this)" class="tab-btn active text-xs">الكل</button>
      <button onclick="setRF('pending',this)" class="tab-btn text-xs">معلق</button>
      <button onclick="setRF('manager_approved',this)" class="tab-btn text-xs">موافق مدير</button>
      <button onclick="setRF('travel_desk',this)" class="tab-btn text-xs">Travel Desk</button>
      <button onclick="setRF('booking_confirmed',this)" class="tab-btn text-xs">محجوز</button>
      <button onclick="setRF('completed',this)" class="tab-btn text-xs">مكتمل</button>
    </div>
    <div class="flex-1 overflow-y-auto p-5">
      <div id="reqList"><div class="text-center py-10 text-gray-400">جاري التحميل…</div></div>
    </div>
  </div>
</div>

<!-- Add Request Modal -->
<div id="addReqModal" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-bold text-gray-800">طلب سفر وظيفي</h3>
      <button onclick="closeAddRequest()" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-times"></i></button>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div class="col-span-2"><label>اسم الموظف *</label><input type="text" id="rq_emp"></div>
      <div><label>البريد الإلكتروني</label><input type="email" id="rq_email" dir="ltr"></div>
      <div><label>القسم</label><input type="text" id="rq_dept"></div>
      <div><label>مركز التكلفة</label><input type="text" id="rq_cc" dir="ltr"></div>
      <div><label>الغرض من السفر</label><input type="text" id="rq_purpose"></div>
      <div><label>الوجهة</label><input type="text" id="rq_dest"></div>
      <div><label>تاريخ السفر</label><input type="date" id="rq_from"></div>
      <div><label>تاريخ العودة</label><input type="date" id="rq_to"></div>
      <div><label>عدد المسافرين</label><input type="number" id="rq_pax" value="1" min="1"></div>
      <div><label>فئة الطيران</label>
        <select id="rq_flight"><option value="economy">اقتصادي</option><option value="business">أعمال</option><option value="first">أول</option></select>
      </div>
      <div><label>الميزانية التقديرية</label><input type="number" id="rq_budget" value="0" min="0"></div>
      <div><label>الحالة</label>
        <select id="rq_status">
          <option value="pending">معلق</option>
          <option value="manager_approved">موافقة المدير</option>
          <option value="manager_rejected">رفض المدير</option>
          <option value="travel_desk">Travel Desk</option>
          <option value="quoted">صدر عرض</option>
          <option value="booking_confirmed">تم الحجز</option>
          <option value="completed">مكتمل</option>
          <option value="cancelled">ملغي</option>
        </select>
      </div>
      <div><label>اسم المدير المعتمد</label><input type="text" id="rq_mgr"></div>
      <div><label>بريد المدير</label><input type="email" id="rq_mgr_email" dir="ltr"></div>
      <div class="col-span-2"><label>ملاحظات</label><textarea id="rq_notes" rows="2"></textarea></div>
    </div>
    <div class="flex gap-2 mt-4">
      <button onclick="saveRequest()" class="flex-1 bg-primary text-white font-bold py-2.5 rounded-lg text-sm hover:bg-lightGreen transition">حفظ</button>
      <button onclick="closeAddRequest()" class="flex-1 bg-gray-100 text-gray-700 font-bold py-2.5 rounded-lg text-sm hover:bg-gray-200 transition">إلغاء</button>
    </div>
  </div>
</div>

<!-- New / Edit Modal -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between p-4 border-b sticky top-0 bg-white">
      <h3 class="font-bold text-primary" id="modalTitle"><i class="fa-solid fa-building ml-2"></i>شركة جديدة</h3>
      <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 text-xl"><i class="fa-solid fa-times"></i></button>
    </div>
    <div class="p-4 grid grid-cols-2 gap-3">
      <div class="col-span-2"><label>اسم الشركة *</label><input type="text" id="f_name"></div>
      <div><label>القطاع</label><input type="text" id="f_industry" placeholder="نفط / بنوك / صناعة…"></div>
      <div><label>الدولة</label><input type="text" id="f_country" placeholder="مصر / السعودية…"></div>
      <div><label>المدينة</label><input type="text" id="f_city"></div>
      <div><label>الموقع الإلكتروني</label><input type="text" id="f_web" dir="ltr" placeholder="https://…"></div>
      <div><label>الرقم الضريبي</label><input type="text" id="f_tax" dir="ltr"></div>
      <div><label>العملة</label>
        <select id="f_curr"><option value="EGP">EGP</option><option value="USD">USD</option><option value="EUR">EUR</option><option value="SAR">SAR</option></select>
      </div>
      <div><label>الحد الائتماني</label><input type="number" id="f_credit" value="0" step="0.01"></div>
      <div><label>مدة السداد (أيام)</label><input type="number" id="f_terms" value="30"></div>

      <div class="col-span-2 border-t pt-3 mt-1 font-bold text-gray-600 text-sm">جهة الاتصال الرئيسية</div>
      <div><label>الاسم</label><input type="text" id="f_pc_name"></div>
      <div><label>البريد الإلكتروني</label><input type="text" id="f_pc_email" dir="ltr"></div>
      <div><label>الهاتف</label><input type="text" id="f_pc_phone"></div>
      <div><label>جهة اتصال المالية</label><input type="text" id="f_fc_name"></div>

      <div class="col-span-2 border-t pt-3 mt-1 font-bold text-gray-600 text-sm">سياسة السفر</div>
      <div class="col-span-2"><textarea id="f_policy" rows="2" placeholder="الفئة المعتمدة / شروط الحجز / التوقيع المطلوب…"></textarea></div>

      <div><label>الحالة</label>
        <select id="f_active"><option value="true">نشط</option><option value="false">موقوف</option></select>
      </div>
      <div class="col-span-2"><label>ملاحظات</label><textarea id="f_notes" rows="2"></textarea></div>
    </div>
    <div class="flex justify-end gap-2 p-4 border-t">
      <button onclick="closeModal()" class="px-4 py-2 text-sm bg-gray-100 rounded-lg">إلغاء</button>
      <button onclick="save()" class="px-4 py-2 text-sm font-bold bg-primary text-white rounded-lg hover:bg-lightGreen">حفظ</button>
    </div>
  </div>
</div>

<script>
let _all=[], _editId=null;

document.addEventListener('DOMContentLoaded', async()=>{
  if(!await adminCheckAuth())return;
  NSPNav.init();
  await load();
});

async function load(){
  const {data}=await db.from('corporate_accounts').select('*').order('company_name');
  _all=data||[];
  document.getElementById('pageSubtitle').textContent=`${_all.length} شركة مسجّلة`;
  const active=_all.filter(a=>a.is_active);
  document.getElementById('kpiStrip').innerHTML=`
    <div class="erp-card p-4 text-center border-b-2 border-primary"><div class="text-2xl font-black text-primary">${_all.length}</div><div class="text-xs text-gray-400 mt-1">إجمالي</div></div>
    <div class="erp-card p-4 text-center border-b-2 border-blue-400"><div class="text-2xl font-black text-blue-600">${active.length}</div><div class="text-xs text-gray-400 mt-1">نشطة</div></div>
    <div class="erp-card p-4 text-center border-b-2 border-green-400"><div class="text-xl font-black text-green-700">${_all.reduce((s,a)=>s+Number(a.credit_limit||0),0).toLocaleString('ar-EG')}</div><div class="text-xs text-gray-400 mt-1">إجمالي الائتمان</div></div>
    <div class="erp-card p-4 text-center border-b-2 border-amber-400"><div class="text-xl font-black text-amber-600">${_all.reduce((s,a)=>s+Number(a.credit_balance||0),0).toLocaleString('ar-EG')}</div><div class="text-xs text-gray-400 mt-1">رصيد مستخدم</div></div>`;
  render();
}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  let rows=_all;
  if(q)rows=rows.filter(a=>(a.company_name||'').toLowerCase().includes(q)||(a.account_number||'').toLowerCase().includes(q));
  const tbody=document.getElementById('tbody');
  if(!rows.length){tbody.innerHTML='<tr><td colspan="5" class="text-center py-8 text-gray-400">لا توجد نتائج</td></tr>';return;}
  tbody.innerHTML=rows.map(a=>`<tr class="cursor-pointer ${!a.is_active?'opacity-50':''}" onclick="showDetail('${a.id}')">
    <td class="font-mono text-xs text-gray-400">${esc(a.account_number||'—')}</td>
    <td class="font-bold text-sm">${esc(a.company_name)}</td>
    <td class="text-xs text-gray-500">${esc(a.industry||'—')}</td>
    <td class="text-xs text-gray-500">${esc(a.country||'—')}</td>
    <td class="text-sm font-bold">${Number(a.credit_limit||0).toLocaleString('ar-EG')} <span class="text-xs text-gray-400">${a.currency}</span></td>
  </tr>`).join('');
}

function showDetail(id){
  const a=_all.find(x=>x.id===id); if(!a)return;
  const fmtN=n=>Number(n||0).toLocaleString('ar-EG');
  const used=Number(a.credit_balance||0);
  const limit=Number(a.credit_limit||0);
  const pct=limit>0?Math.min(100,Math.round(used/limit*100)):0;
  document.getElementById('detailPanel').innerHTML=`
    <div class="erp-card p-4">
      <div class="flex items-start justify-between mb-4">
        <div>
          <h3 class="font-black text-lg text-gray-800">${esc(a.company_name)}</h3>
          <div class="text-xs text-gray-400">${a.account_number||''} — ${esc(a.industry||'')} — ${esc(a.country||'')}</div>
        </div>
        <div class="flex gap-2">
          <button onclick="editCorp('${a.id}')" class="erp-page-btn text-xs"><i class="fa-solid fa-pen ml-1"></i>تعديل</button>
        </div>
      </div>
      <!-- Credit Bar -->
      <div class="bg-gray-50 rounded-xl p-3 mb-4">
        <div class="flex justify-between text-xs text-gray-500 mb-1">
          <span>رصيد مستخدم</span><span>${fmtN(used)} / ${fmtN(limit)} ${a.currency}</span>
        </div>
        <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
          <div class="h-full rounded-full transition-all" style="width:${pct}%;background:${pct>80?'#dc2626':pct>50?'#d97706':'#16a34a'}"></div>
        </div>
        <div class="text-xs text-gray-400 mt-1">${pct}% مستخدم — مدة السداد ${a.payment_terms_days||30} يوم</div>
      </div>
      <!-- Info Rows -->
      <div class="grid grid-cols-2 gap-x-4">
        <div>
          <div class="info-row"><div class="info-label">جهة الاتصال</div><div class="info-val">${esc(a.primary_contact_name||'—')}</div></div>
          <div class="info-row"><div class="info-label">بريد الاتصال</div><div class="info-val text-sm" dir="ltr">${esc(a.primary_contact_email||'—')}</div></div>
          <div class="info-row"><div class="info-label">هاتف الاتصال</div><div class="info-val">${esc(a.primary_contact_phone||'—')}</div></div>
          <div class="info-row"><div class="info-label">المالية</div><div class="info-val">${esc(a.finance_contact_name||'—')}</div></div>
        </div>
        <div>
          <div class="info-row"><div class="info-label">الموقع</div><div class="info-val text-sm" dir="ltr">${esc(a.website||'—')}</div></div>
          <div class="info-row"><div class="info-label">الرقم الضريبي</div><div class="info-val" dir="ltr">${esc(a.tax_number||'—')}</div></div>
          <div class="info-row"><div class="info-label">الحالة</div><div class="info-val"><span class="text-xs px-2 py-0.5 rounded-full font-bold ${a.is_active?'bg-green-100 text-green-700':'bg-gray-100 text-gray-500'}">${a.is_active?'نشط':'موقوف'}</span></div></div>
        </div>
      </div>
      ${a.travel_policy?`<div class="mt-3 bg-blue-50 border border-blue-100 rounded-lg p-3 text-xs text-blue-800"><strong>سياسة السفر:</strong> ${esc(a.travel_policy)}</div>`:''}
      <div class="mt-4 pt-4 border-t">
        <button onclick="openRequests('${a.id}')" class="w-full bg-blue-50 text-blue-700 font-bold py-2.5 rounded-lg text-sm hover:bg-blue-100 transition">
          <i class="fa-solid fa-plane ml-2"></i>طلبات السفر الوظيفي
        </button>
      </div>
    </div>`;
}

function openNew(){_editId=null;['f_name','f_industry','f_country','f_city','f_web','f_tax','f_pc_name','f_pc_email','f_pc_phone','f_fc_name','f_policy','f_notes'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('f_credit').value=0;document.getElementById('f_terms').value=30;document.getElementById('f_curr').value='EGP';document.getElementById('f_active').value='true';
  document.getElementById('modalTitle').innerHTML='<i class="fa-solid fa-building ml-2"></i>شركة جديدة';
  document.getElementById('modal').classList.remove('hidden');}

function editCorp(id){
  const a=_all.find(x=>x.id===id);if(!a)return;_editId=id;
  document.getElementById('f_name').value=a.company_name||'';
  document.getElementById('f_industry').value=a.industry||'';document.getElementById('f_country').value=a.country||'';
  document.getElementById('f_city').value=a.city||'';document.getElementById('f_web').value=a.website||'';
  document.getElementById('f_tax').value=a.tax_number||'';document.getElementById('f_curr').value=a.currency||'EGP';
  document.getElementById('f_credit').value=a.credit_limit||0;document.getElementById('f_terms').value=a.payment_terms_days||30;
  document.getElementById('f_pc_name').value=a.primary_contact_name||'';document.getElementById('f_pc_email').value=a.primary_contact_email||'';
  document.getElementById('f_pc_phone').value=a.primary_contact_phone||'';document.getElementById('f_fc_name').value=a.finance_contact_name||'';
  document.getElementById('f_policy').value=a.travel_policy||'';document.getElementById('f_notes').value=a.notes||'';
  document.getElementById('f_active').value=a.is_active?'true':'false';
  document.getElementById('modalTitle').innerHTML='<i class="fa-solid fa-pen ml-2"></i>تعديل: '+esc(a.company_name);
  document.getElementById('modal').classList.remove('hidden');}

function closeModal(){document.getElementById('modal').classList.add('hidden');_editId=null;}

async function save(){
  const name=document.getElementById('f_name').value.trim();
  if(!name){toast('اسم الشركة مطلوب',true);return;}
  const payload={
    company_name:name,industry:document.getElementById('f_industry').value.trim()||null,
    country:document.getElementById('f_country').value.trim()||null,city:document.getElementById('f_city').value.trim()||null,
    website:document.getElementById('f_web').value.trim()||null,tax_number:document.getElementById('f_tax').value.trim()||null,
    currency:document.getElementById('f_curr').value,credit_limit:parseFloat(document.getElementById('f_credit').value)||0,
    payment_terms_days:parseInt(document.getElementById('f_terms').value)||30,
    primary_contact_name:document.getElementById('f_pc_name').value.trim()||null,
    primary_contact_email:document.getElementById('f_pc_email').value.trim()||null,
    primary_contact_phone:document.getElementById('f_pc_phone').value.trim()||null,
    finance_contact_name:document.getElementById('f_fc_name').value.trim()||null,
    travel_policy:document.getElementById('f_policy').value.trim()||null,
    notes:document.getElementById('f_notes').value.trim()||null,
    is_active:document.getElementById('f_active').value==='true',
    updated_at:new Date().toISOString(),
  };
  const {error}=_editId
    ?await db.from('corporate_accounts').update(payload).eq('id',_editId)
    :await db.from('corporate_accounts').insert({...payload,created_by:(await db.auth.getUser()).data?.user?.id});
  if(error){toast('خطأ: '+error.message,true);return;}
  closeModal();toast(_editId?'تم التحديث ✓':'تمت الإضافة ✓');await load();
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(msg,err){const el=document.getElementById('toast');el.textContent=msg;el.style.background=err?'#c62828':'#1B5E20';el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800);}

// ── TRAVEL REQUESTS ─────────────────────────────────────────────────────────
let _reqCorpId = null, _allReqs = [], _reqFilter = 'all', _editReqId = null;

const REQ_STATUS = {
  pending:           ['bg-amber-100 text-amber-700','معلق'],
  manager_approved:  ['bg-blue-100 text-blue-700','موافقة مدير'],
  manager_rejected:  ['bg-red-100 text-red-700','رفض مدير'],
  travel_desk:       ['bg-purple-100 text-purple-700','Travel Desk'],
  quoted:            ['bg-indigo-100 text-indigo-700','صدر عرض'],
  booking_confirmed: ['bg-green-100 text-green-700','محجوز ✓'],
  completed:         ['bg-gray-100 text-gray-500','مكتمل'],
  cancelled:         ['bg-red-50 text-red-400','ملغي'],
};

async function openRequests(corpId) {
  _reqCorpId = corpId;
  _reqFilter = 'all';
  const corp = _all.find(a=>a.id===corpId);
  document.getElementById('reqSubtitle').textContent = corp?.company_name||'';
  document.getElementById('reqDrawer').classList.remove('hidden');
  document.querySelectorAll('#reqDrawer .tab-btn').forEach((b,i)=>b.classList.toggle('active',i===0));
  await loadRequests();
}

function closeRequests() {
  document.getElementById('reqDrawer').classList.add('hidden');
  _reqCorpId = null;
}

function setRF(f,btn) {
  _reqFilter = f;
  document.querySelectorAll('#reqDrawer .tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderRequests();
}

async function loadRequests() {
  const {data} = await db.from('corporate_travel_requests')
    .select('*')
    .eq('corporate_id', _reqCorpId)
    .order('created_at', {ascending:false});
  _allReqs = data||[];
  renderRequests();
}

function renderRequests() {
  const rows = _reqFilter==='all' ? _allReqs : _allReqs.filter(r=>r.status===_reqFilter);
  const el = document.getElementById('reqList');
  if(!rows.length){el.innerHTML='<div class="text-center py-10 text-gray-400">لا توجد طلبات سفر</div>';return;}
  el.innerHTML = rows.map(r=>{
    const [sc,sl] = REQ_STATUS[r.status]||['bg-gray-100 text-gray-600','—'];
    return `<div class="border border-gray-100 rounded-xl p-4 mb-3 hover:border-primary transition cursor-pointer" onclick="editRequest('${r.id}')">
      <div class="flex items-start justify-between">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span class="text-xs font-mono text-gray-400">${r.request_number||'—'}</span>
            <span class="text-xs px-2 py-0.5 rounded-full font-bold ${sc}">${sl}</span>
          </div>
          <p class="font-bold text-gray-800 text-sm">${esc(r.employee_name)}</p>
          <p class="text-xs text-gray-400">${esc(r.employee_department||'')} ${r.cost_center?'· '+r.cost_center:''}</p>
        </div>
        <div class="text-left text-xs text-gray-400">
          <p>${r.travel_date_from||'—'}</p>
          <p class="font-bold text-gray-700 text-sm mt-1">${Number(r.estimated_budget||0).toLocaleString('ar-EG')} ${r.currency}</p>
        </div>
      </div>
      <div class="flex items-center gap-4 mt-2 text-xs text-gray-500">
        <span><i class="fa-solid fa-location-dot ml-1"></i>${esc(r.destination||'—')}</span>
        <span><i class="fa-solid fa-users ml-1"></i>${r.travelers_count||1} مسافر</span>
        ${r.purpose?`<span><i class="fa-solid fa-briefcase ml-1"></i>${esc(r.purpose)}</span>`:''}
      </div>
    </div>`;
  }).join('');
}

function openAddRequest() {
  _editReqId = null;
  ['rq_emp','rq_email','rq_dept','rq_cc','rq_purpose','rq_dest','rq_from','rq_to','rq_mgr','rq_mgr_email','rq_notes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('rq_pax').value=1;
  document.getElementById('rq_budget').value=0;
  document.getElementById('rq_flight').value='economy';
  document.getElementById('rq_status').value='pending';
  document.getElementById('addReqModal').classList.remove('hidden');
}

async function editRequest(id) {
  const {data:r} = await db.from('corporate_travel_requests').select('*').eq('id',id).single();
  if(!r) return;
  _editReqId = id;
  document.getElementById('rq_emp').value        = r.employee_name||'';
  document.getElementById('rq_email').value      = r.employee_email||'';
  document.getElementById('rq_dept').value       = r.employee_department||'';
  document.getElementById('rq_cc').value         = r.cost_center||'';
  document.getElementById('rq_purpose').value    = r.purpose||'';
  document.getElementById('rq_dest').value       = r.destination||'';
  document.getElementById('rq_from').value       = r.travel_date_from||'';
  document.getElementById('rq_to').value         = r.travel_date_to||'';
  document.getElementById('rq_pax').value        = r.travelers_count||1;
  document.getElementById('rq_flight').value     = r.flight_class||'economy';
  document.getElementById('rq_budget').value     = r.estimated_budget||0;
  document.getElementById('rq_status').value     = r.status||'pending';
  document.getElementById('rq_mgr').value        = r.manager_name||'';
  document.getElementById('rq_mgr_email').value  = r.manager_email||'';
  document.getElementById('rq_notes').value      = r.notes||'';
  document.getElementById('addReqModal').classList.remove('hidden');
}

function closeAddRequest() {
  document.getElementById('addReqModal').classList.add('hidden');
  _editReqId = null;
}

async function saveRequest() {
  const emp = document.getElementById('rq_emp').value.trim();
  if(!emp){toast('اسم الموظف مطلوب',true);return;}
  const payload = {
    corporate_id:        _reqCorpId,
    employee_name:       emp,
    employee_email:      document.getElementById('rq_email').value.trim()||null,
    employee_department: document.getElementById('rq_dept').value.trim()||null,
    cost_center:         document.getElementById('rq_cc').value.trim()||null,
    purpose:             document.getElementById('rq_purpose').value.trim()||null,
    destination:         document.getElementById('rq_dest').value.trim()||null,
    travel_date_from:    document.getElementById('rq_from').value||null,
    travel_date_to:      document.getElementById('rq_to').value||null,
    travelers_count:     parseInt(document.getElementById('rq_pax').value)||1,
    flight_class:        document.getElementById('rq_flight').value,
    estimated_budget:    parseFloat(document.getElementById('rq_budget').value)||0,
    status:              document.getElementById('rq_status').value,
    manager_name:        document.getElementById('rq_mgr').value.trim()||null,
    manager_email:       document.getElementById('rq_mgr_email').value.trim()||null,
    notes:               document.getElementById('rq_notes').value.trim()||null,
    updated_at:          new Date().toISOString(),
  };
  let error;
  if(_editReqId){
    ({error} = await db.from('corporate_travel_requests').update(payload).eq('id',_editReqId));
  } else {
    ({error} = await db.from('corporate_travel_requests').insert(payload));
  }
  if(error){toast('خطأ: '+error.message,true);return;}
  closeAddRequest();
  toast(_editReqId?'تم التحديث ✓':'تمت الإضافة ✓');
  await loadRequests();
}
</script>
