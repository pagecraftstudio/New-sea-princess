<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>العملاء 360° | نيو سي برنسيس</title>
  <script>tailwind={config:{theme:{extend:{colors:{primary:"#1B5E20",lightGreen:"#2E7D32",gold:"#B8860B",lightGold:"#DAA520",darkBg:"#0D1B0E",offWhite:"#F8F5EC",borderGold:"#D4AF6A",success:"#2E7D32",warning:"#F57F17",error:"#C62828"},fontFamily:{sans:["Cairo","sans-serif"]}}}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/custom.css">
  <link rel="stylesheet" href="/css/erp-ui.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js"></script>
  <script src="/js/admin.js"></script>
  <style>
    .badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:9999px;font-size:.72rem;font-weight:700;}
    .badge-green{background:#dcfce7;color:#166534;}
    .badge-red{background:#fee2e2;color:#991b1b;}
    .badge-yellow{background:#fef9c3;color:#854d0e;}
    .badge-gray{background:#f3f4f6;color:#374151;}
    .badge-blue{background:#dbeafe;color:#1e40af;}
    .badge-purple{background:#ede9fe;color:#6d28d9;}
    .badge-gold{background:#fef9c3;color:#92400e;}
    .cust-row:hover{background:#f0fdf4;cursor:pointer;}
    .stat-card{background:#fff;border-radius:1rem;padding:1.25rem 1.5rem;box-shadow:0 1px 4px rgba(0,0,0,.07);border:1px solid #e5e7eb;}
  </style>
  <script src="/js/admin-nav.js"></script>
</head>
<body class="bg-gray-100 min-h-screen" style="font-family:'Cairo',sans-serif;">
<div id="adminNavMount"></div>

<main class="flex-1 flex flex-col p-4 md:p-6 overflow-x-hidden">

  <!-- Header -->
  <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
    <div>
      <h2 class="erp-page-title">العملاء 360°</h2>
      <p class="erp-page-subtitle">قاعدة عملاء موحدة • ملف كامل لكل عميل</p>
    </div>
    <button onclick="openNewCustomer()"
      class="bg-primary hover:bg-lightGreen text-white px-5 py-2.5 rounded-lg font-bold flex items-center gap-2 transition text-sm shadow">
      <i class="fa-solid fa-user-plus"></i> عميل جديد
    </button>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="stat-card">
      <div class="text-xs text-gray-500 mb-1">إجمالي العملاء</div>
      <div class="text-2xl font-bold text-primary" id="statTotal">—</div>
    </div>
    <div class="stat-card">
      <div class="text-xs text-gray-500 mb-1">إجمالي الإيرادات</div>
      <div class="text-xl font-bold text-green-700" id="statRevenue">—</div>
    </div>
    <div class="stat-card">
      <div class="text-xs text-gray-500 mb-1">رصيد مستحق</div>
      <div class="text-xl font-bold text-red-600" id="statOutstanding">—</div>
    </div>
    <div class="stat-card">
      <div class="text-xs text-gray-500 mb-1">عملاء VIP</div>
      <div class="text-2xl font-bold text-gold" id="statVip">—</div>
    </div>
  </div>

  <!-- Filters -->
  <div class="bg-white rounded-xl shadow border border-gray-200 p-4 mb-4">
    <div class="flex flex-wrap gap-3">
      <div class="flex-1 min-w-[200px] relative">
        <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
        <input id="searchInput" type="text" placeholder="بحث بالاسم أو الهاتف أو الإيميل..."
          class="w-full border border-gray-300 rounded-lg py-2 pr-9 pl-3 text-sm focus:ring-2 focus:ring-primary outline-none"
          oninput="renderCustomers()">
      </div>
      <select id="filterType" onchange="renderCustomers()"
        class="border border-gray-300 rounded-lg py-2 px-3 text-sm focus:ring-2 focus:ring-primary outline-none">
        <option value="">جميع الأنواع</option>
        <option value="b2c">B2C</option>
        <option value="b2b">B2B</option>
        <option value="corporate">شركات</option>
        <option value="mice">MICE</option>
      </select>
      <select id="filterSegment" onchange="renderCustomers()"
        class="border border-gray-300 rounded-lg py-2 px-3 text-sm focus:ring-2 focus:ring-primary outline-none">
        <option value="">جميع الفئات</option>
        <option value="new">جديد</option>
        <option value="returning">عائد</option>
        <option value="vip">VIP</option>
        <option value="high_ltv">قيمة عالية</option>
        <option value="family">عائلة</option>
        <option value="couple">زوجان</option>
        <option value="honeymoon">شهر عسل</option>
        <option value="luxury">فاخر</option>
        <option value="adventure">مغامرة</option>
        <option value="religious">ديني</option>
        <option value="dormant">غير نشط</option>
      </select>
    </div>
  </div>

  <!-- Table -->
  <div class="bg-white rounded-xl shadow border border-gray-200 overflow-hidden">
    <div id="loadingState" class="flex items-center justify-center py-16 text-gray-400 gap-3">
      <i class="fa-solid fa-spinner fa-spin text-2xl text-primary"></i>
      <span>جارٍ تحميل العملاء...</span>
    </div>
    <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-gray-400 gap-3">
      <i class="fa-solid fa-users-slash text-4xl"></i>
      <span>لا يوجد عملاء</span>
      <button onclick="openNewCustomer()" class="mt-2 text-sm text-primary hover:underline font-bold">+ إضافة أول عميل</button>
    </div>
    <div id="tableWrap" class="hidden overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="bg-gray-50 text-gray-600 text-xs border-b">
            <th class="px-4 py-3 text-right font-bold">العميل</th>
            <th class="px-4 py-3 text-right font-bold">التواصل</th>
            <th class="px-4 py-3 text-center font-bold">النوع / الفئة</th>
            <th class="px-4 py-3 text-center font-bold">الحجوزات</th>
            <th class="px-4 py-3 text-left font-bold">إجمالي الإنفاق</th>
            <th class="px-4 py-3 text-left font-bold">مستحق</th>
            <th class="px-4 py-3 text-center font-bold">فرص / لدز</th>
            <th class="px-4 py-3 text-center font-bold">إجراءات</th>
          </tr>
        </thead>
        <tbody id="customersBody"></tbody>
      </table>
    </div>
    <div class="border-t px-4 py-3 flex items-center justify-between bg-gray-50">
      <span id="paginationInfo" class="text-xs text-gray-500"></span>
      <div class="flex gap-2">
        <button id="prevBtn" onclick="prevPage()" class="px-3 py-1.5 text-xs border rounded hover:bg-gray-100 disabled:opacity-40">السابق</button>
        <button id="nextBtn" onclick="nextPage()" class="px-3 py-1.5 text-xs border rounded hover:bg-gray-100 disabled:opacity-40">التالي</button>
      </div>
    </div>
  </div>

</main>
</div>

<!-- NEW CUSTOMER MODAL -->
<div id="newCustomerModal" class="fixed inset-0 z-[70] hidden">
  <div class="absolute inset-0 bg-black/60" onclick="closeNewCustomer()"></div>
  <div class="absolute inset-y-0 left-0 w-full md:w-[520px] bg-white shadow-2xl flex flex-col overflow-hidden">
    <div class="bg-primary text-white px-6 py-4 flex items-center justify-between">
      <h3 class="text-lg font-bold">عميل جديد</h3>
      <button onclick="closeNewCustomer()" class="text-white/70 hover:text-white text-2xl"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="flex-1 overflow-y-auto p-6 space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">
          <label class="block text-xs font-bold text-gray-600 mb-1">الاسم الكامل *</label>
          <input id="nc_name" type="text" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">البريد الإلكتروني</label>
          <input id="nc_email" type="email" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">الهاتف</label>
          <input id="nc_phone" type="tel" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">واتساب</label>
          <input id="nc_whatsapp" type="tel" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">الجنسية</label>
          <input id="nc_nationality" type="text" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">نوع العميل</label>
          <select id="nc_type" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary outline-none">
            <option value="b2c">B2C — أفراد</option>
            <option value="b2b">B2B — شركاء</option>
            <option value="corporate">Corporate — شركات</option>
            <option value="mice">MICE</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">الفئة</label>
          <select id="nc_segment" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary outline-none">
            <option value="new">جديد</option>
            <option value="returning">عائد</option>
            <option value="vip">VIP</option>
            <option value="family">عائلة</option>
            <option value="couple">زوجان</option>
            <option value="honeymoon">شهر عسل</option>
            <option value="luxury">فاخر</option>
            <option value="adventure">مغامرة</option>
            <option value="religious">ديني</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">مصدر العميل</label>
          <select id="nc_source" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary outline-none">
            <option value="manual">إدخال يدوي</option>
            <option value="website">الموقع</option>
            <option value="whatsapp">واتساب</option>
            <option value="phone">هاتف</option>
            <option value="referral">توصية</option>
            <option value="social">وسائل التواصل</option>
            <option value="b2b">شريك B2B</option>
          </select>
        </div>
        <div class="flex items-center gap-2 col-span-2">
          <input id="nc_vip" type="checkbox" class="w-4 h-4 accent-gold">
          <label for="nc_vip" class="text-sm font-bold text-gray-700">عميل VIP</label>
        </div>
        <div class="col-span-2">
          <label class="block text-xs font-bold text-gray-600 mb-1">ملاحظات</label>
          <textarea id="nc_notes" rows="2" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary outline-none resize-none"></textarea>
        </div>
      </div>
      <div id="ncError" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3"></div>
    </div>
    <div class="p-5 border-t flex gap-3">
      <button onclick="saveNewCustomer()" id="ncSaveBtn"
        class="flex-1 bg-primary text-white font-bold py-2.5 rounded-lg hover:bg-lightGreen transition text-sm">
        <i class="fa-solid fa-floppy-disk ml-1"></i> حفظ العميل
      </button>
      <button onclick="closeNewCustomer()" class="px-5 border border-gray-200 text-gray-600 font-bold py-2.5 rounded-lg text-sm">إلغاء</button>
    </div>
  </div>
</div>

<script>
const SEG_LABELS = { new:'جديد', returning:'عائد', vip:'VIP', high_ltv:'قيمة عالية', family:'عائلة', couple:'زوجان', honeymoon:'شهر عسل', luxury:'فاخر', adventure:'مغامرة', religious:'ديني', corporate:'شركة', dormant:'غير نشط' };
const TYPE_LABELS = { b2c:'B2C', b2b:'B2B', corporate:'Corporate', mice:'MICE' };
const PAGE_SIZE = 25;
let allCustomers = [], filteredCustomers = [], currentPage = 1;

function fmtMoney(v) {
  if (v == null || v === 0) return '—';
  return Number(v).toLocaleString('ar-EG', {minimumFractionDigits:0, maximumFractionDigits:0}) + ' ج.م';
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!await adminCheckAuth()) return;
  await loadCustomers();
});

async function loadCustomers() {
  try {
    const { data, error } = await db.from('customer_360_summary')
      .select('*')
      .order('created_at', { ascending: false });
    if (error) throw error;

    allCustomers = data || [];

    // Stats
    document.getElementById('statTotal').textContent = allCustomers.length;
    document.getElementById('statRevenue').textContent = fmtMoney(allCustomers.reduce((s,c) => s + Number(c.total_spent||0), 0));
    document.getElementById('statOutstanding').textContent = fmtMoney(allCustomers.reduce((s,c) => s + Number(c.total_outstanding||0), 0));
    document.getElementById('statVip').textContent = allCustomers.filter(c => c.vip).length;

    renderCustomers();
  } catch(e) {
    document.getElementById('loadingState').innerHTML =
      `<i class="fa-solid fa-circle-exclamation text-red-500 text-2xl"></i>
       <span class="text-red-500 mr-2">خطأ: ${e.message}</span>`;
  }
}

function renderCustomers() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const typeF   = document.getElementById('filterType').value;
  const segF    = document.getElementById('filterSegment').value;

  filteredCustomers = allCustomers.filter(c => {
    if (typeF && c.customer_type !== typeF) return false;
    if (segF  && c.segment !== segF) return false;
    if (search && !c.full_name?.toLowerCase().includes(search)
                && !c.phone?.includes(search)
                && !c.email?.toLowerCase().includes(search)) return false;
    return true;
  });

  currentPage = 1;
  renderPage();
}

function renderPage() {
  const total  = filteredCustomers.length;
  const start  = (currentPage - 1) * PAGE_SIZE;
  const end    = Math.min(start + PAGE_SIZE, total);
  const slice  = filteredCustomers.slice(start, end);

  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('emptyState').classList.toggle('hidden', total > 0);
  document.getElementById('emptyState').classList.toggle('flex', total === 0);
  document.getElementById('tableWrap').classList.toggle('hidden', total === 0);

  document.getElementById('paginationInfo').textContent =
    total ? `عرض ${start+1}–${end} من ${total} عميل` : '';
  document.getElementById('prevBtn').disabled = currentPage === 1;
  document.getElementById('nextBtn').disabled = end >= total;

  document.getElementById('customersBody').innerHTML = slice.map(c => {
    const hasBalance  = Number(c.total_outstanding) > 0;
    const balanceCls  = hasBalance ? 'text-red-600 font-bold' : 'text-gray-400';
    const vipBadge    = c.vip ? `<span class="badge badge-gold ml-1">⭐ VIP</span>` : '';
    const segBadge    = c.segment ? `<span class="badge badge-gray">${SEG_LABELS[c.segment]||c.segment}</span>` : '';
    const typeBadge   = `<span class="badge badge-blue">${TYPE_LABELS[c.customer_type]||c.customer_type}</span>`;
    const openLeads   = Number(c.open_leads||0);
    const openOpps    = Number(c.open_opportunities||0);
    const crmBadge    = (openLeads + openOpps) > 0
      ? `<span class="badge badge-purple">${openLeads} لد / ${openOpps} فرص</span>`
      : `<span class="text-gray-300 text-xs">—</span>`;

    return `<tr class="border-b cust-row" onclick="goToDetail('${c.id}')">
      <td class="px-4 py-3">
        <div class="font-bold text-gray-800">${c.full_name||'—'} ${vipBadge}</div>
        <div class="text-xs text-gray-400">${c.customer_number||''}</div>
      </td>
      <td class="px-4 py-3">
        <div class="text-xs text-gray-600">${c.phone||'—'}</div>
        <div class="text-xs text-gray-400">${c.email||''}</div>
      </td>
      <td class="px-4 py-3 text-center space-y-1">${typeBadge}<br>${segBadge}</td>
      <td class="px-4 py-3 text-center">
        <span class="badge badge-blue">${c.total_bookings||0}</span>
      </td>
      <td class="px-4 py-3 text-left font-mono text-sm font-bold text-gray-800">
        ${fmtMoney(c.total_spent)}
      </td>
      <td class="px-4 py-3 text-left font-mono text-sm ${balanceCls}">
        ${hasBalance ? fmtMoney(c.total_outstanding) : '—'}
      </td>
      <td class="px-4 py-3 text-center">${crmBadge}</td>
      <td class="px-4 py-3 text-center">
        <a href="/nsp-control-8x4k/customer-detail.html?id=${c.id}"
           onclick="event.stopPropagation()"
           class="text-primary hover:text-green-800 text-xs font-bold border border-primary rounded px-2 py-1 hover:bg-green-50 transition">
          <i class="fa-solid fa-address-card ml-1"></i>ملف كامل
        </a>
      </td>
    </tr>`;
  }).join('');
}

function goToDetail(id) {
  window.location.href = `/nsp-control-8x4k/customer-detail.html?id=${id}`;
}

function prevPage() { if (currentPage > 1) { currentPage--; renderPage(); } }
function nextPage() {
  if (currentPage * PAGE_SIZE < filteredCustomers.length) { currentPage++; renderPage(); }
}

// ── NEW CUSTOMER MODAL ─────────────────────────────────────────────────────
function openNewCustomer() {
  ['nc_name','nc_email','nc_phone','nc_whatsapp','nc_nationality','nc_notes'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('nc_type').value = 'b2c';
  document.getElementById('nc_segment').value = 'new';
  document.getElementById('nc_source').value = 'manual';
  document.getElementById('nc_vip').checked = false;
  document.getElementById('ncError').classList.add('hidden');
  document.getElementById('newCustomerModal').classList.remove('hidden');
}

function closeNewCustomer() {
  document.getElementById('newCustomerModal').classList.add('hidden');
}

async function saveNewCustomer() {
  const name = document.getElementById('nc_name').value.trim();
  if (!name) {
    showNcError('الاسم الكامل مطلوب');
    return;
  }
  const btn = document.getElementById('ncSaveBtn');
  btn.disabled = true;
  btn.textContent = 'جارٍ الحفظ…';

  try {
    const { data: { session } } = await db.auth.getSession();
    const payload = {
      full_name:     name,
      email:         document.getElementById('nc_email').value.trim() || null,
      phone:         document.getElementById('nc_phone').value.trim() || null,
      whatsapp:      document.getElementById('nc_whatsapp').value.trim() || null,
      nationality:   document.getElementById('nc_nationality').value.trim() || null,
      customer_type: document.getElementById('nc_type').value,
      segment:       document.getElementById('nc_segment').value,
      source:        document.getElementById('nc_source').value,
      vip:           document.getElementById('nc_vip').checked,
      notes:         document.getElementById('nc_notes').value.trim() || null,
      created_by:    session?.user?.id,
    };

    const { data, error } = await db.from('customers').insert(payload).select().single();
    if (error) throw error;

    closeNewCustomer();
    // Navigate directly to the new customer's 360° profile
    window.location.href = `/nsp-control-8x4k/customer-detail.html?id=${data.id}`;
  } catch(e) {
    showNcError('فشل الحفظ: ' + e.message);
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-floppy-disk ml-1"></i> حفظ العميل';
  }
}

function showNcError(msg) {
  const el = document.getElementById('ncError');
  el.textContent = msg;
  el.classList.remove('hidden');
}
</script>
</div><!-- /flex wrapper -->
</body>
</html>
