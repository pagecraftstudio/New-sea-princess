<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الجداول السياحية | نيو سي برنسيس</title>
  <script>tailwind={config:{theme:{extend:{colors:{primary:"#1B5E20",lightGreen:"#2E7D32",gold:"#B8860B",lightGold:"#DAA520",darkBg:"#0D1B0E",offWhite:"#F8F5EC",borderGold:"#D4AF6A",success:"#2E7D32",warning:"#F57F17",error:"#C62828"},fontFamily:{sans:["Cairo","sans-serif"]}}}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/custom.css">
  <link rel="stylesheet" href="/css/erp-ui.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/admin-nav.js"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .status-badge { display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700; }
    .s-draft    { background:#f3f4f6;color:#6b7280; }
    .s-review   { background:#fef3c7;color:#b45309; }
    .s-final    { background:#d1fae5;color:#065f46; }
    .s-archived { background:#e5e7eb;color:#9ca3af; }
    .s-template { background:#ede9fe;color:#6d28d9; }
    #toast { position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1B5E20;color:#fff;padding:10px 24px;border-radius:24px;font-size:.85rem;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div id="adminNavMount"></div>

<main class="flex-1 overflow-auto p-4 md:p-6">

  <div class="erp-page-header mb-6">
    <div>
      <h1 class="erp-page-title"><i class="fa-solid fa-map-location-dot ml-2"></i>الجداول السياحية</h1>
      <p class="erp-page-subtitle">جداول Tailor-Made وقوالب الرحلات</p>
    </div>
    <div class="flex gap-2">
      <a href="/nsp-control-8x4k/service-catalog.html" class="erp-page-btn">
        <i class="fa-solid fa-boxes-stacked ml-1"></i>كتالوج الخدمات
      </a>
      <a href="/nsp-control-8x4k/itinerary-builder.html" class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-lightGreen transition">
        <i class="fa-solid fa-plus ml-1"></i>جدول جديد
      </a>
    </div>
  </div>

  <!-- KPIs -->
  <div class="kpi-grid mb-6">
    <div class="erp-card p-4 text-center"><div class="text-2xl font-bold text-primary" id="kpiTotal">—</div><div class="text-xs text-gray-400 mt-1">إجمالي الجداول</div></div>
    <div class="erp-card p-4 text-center"><div class="text-2xl font-bold text-amber-600" id="kpiDraft">—</div><div class="text-xs text-gray-400 mt-1">مسودة</div></div>
    <div class="erp-card p-4 text-center"><div class="text-2xl font-bold text-green-700" id="kpiFinal">—</div><div class="text-xs text-gray-400 mt-1">نهائية</div></div>
    <div class="erp-card p-4 text-center"><div class="text-2xl font-bold text-purple-600" id="kpiTemplate">—</div><div class="text-xs text-gray-400 mt-1">قوالب</div></div>
  </div>

  <!-- Filter tabs -->
  <div class="flex gap-2 mb-4 flex-wrap">
    <button onclick="setFilter('all',this)" class="erp-page-btn active">الكل</button>
    <button onclick="setFilter('draft',this)" class="erp-page-btn">مسودة</button>
    <button onclick="setFilter('review',this)" class="erp-page-btn">مراجعة</button>
    <button onclick="setFilter('final',this)" class="erp-page-btn">نهائية</button>
    <button onclick="setFilter('template',this)" class="erp-page-btn">قوالب</button>
    <input type="text" id="searchInput" placeholder="بحث..." oninput="applyFilters()" class="flex-1 min-w-40 border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-primary">
  </div>

  <!-- Table -->
  <div class="erp-card">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-gray-100">
            <th class="text-right p-3 font-bold text-gray-500 text-xs">الرقم</th>
            <th class="text-right p-3 font-bold text-gray-500 text-xs">العنوان</th>
            <th class="text-right p-3 font-bold text-gray-500 text-xs">الوجهة</th>
            <th class="text-right p-3 font-bold text-gray-500 text-xs">المدة</th>
            <th class="text-right p-3 font-bold text-gray-500 text-xs">إجمالي البيع</th>
            <th class="text-right p-3 font-bold text-gray-500 text-xs">الهامش</th>
            <th class="text-right p-3 font-bold text-gray-500 text-xs">الحالة</th>
            <th class="text-right p-3 font-bold text-gray-500 text-xs">التاريخ</th>
            <th class="p-3"></th>
          </tr>
        </thead>
        <tbody id="itnBody">
          <tr><td colspan="9" class="text-center py-10 text-gray-400"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></td></tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<div id="toast"></div>

<script>
let _all = [];
let _statusFilter = 'all';

document.addEventListener('DOMContentLoaded', async () => {
  if (!await adminCheckAuth()) return;
  NSPNav.init();
  await load();
});

async function load() {
  const { data } = await db.from('itineraries')
    .select(`
      id, itinerary_number, title, destination, trip_type,
      travel_date_from, travel_date_to, duration_nights,
      adults_count, sell_total, margin_pct, status, is_template,
      created_at,
      profiles:created_by(full_name)
    `)
    .order('created_at', { ascending: false });

  _all = data || [];
  renderKPIs();
  applyFilters();
}

function renderKPIs() {
  document.getElementById('kpiTotal').textContent    = _all.length;
  document.getElementById('kpiDraft').textContent    = _all.filter(i=>i.status==='draft').length;
  document.getElementById('kpiFinal').textContent    = _all.filter(i=>i.status==='final').length;
  document.getElementById('kpiTemplate').textContent = _all.filter(i=>i.is_template).length;
}

function setFilter(f, btn) {
  _statusFilter = f;
  document.querySelectorAll('.erp-page-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let rows = _all.filter(i =>
    (_statusFilter === 'all'      ||
     (_statusFilter === 'template' && i.is_template) ||
     (!['template','all'].includes(_statusFilter) && i.status === _statusFilter)) &&
    (!q || (i.title||'').includes(q) || (i.destination||'').includes(q) || (i.itinerary_number||'').includes(q))
  );
  renderTable(rows);
}

function renderTable(rows) {
  const tbody = document.getElementById('itnBody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="text-center py-12 text-gray-400">لا توجد جداول مطابقة</td></tr>';
    return;
  }
  const sMap = { draft:'s-draft',review:'s-review',final:'s-final',archived:'s-archived' };
  const sLabel = { draft:'مسودة',review:'مراجعة',final:'نهائي',archived:'مؤرشف' };
  tbody.innerHTML = rows.map(i => {
    const dur = i.duration_nights != null ? i.duration_nights + ' ليالي' : '—';
    return `<tr class="border-b border-gray-50 hover:bg-gray-50 transition cursor-pointer" onclick="open_('${i.id}')">
      <td class="p-3 text-xs font-mono text-gray-400">${i.itinerary_number||'—'}</td>
      <td class="p-3">
        <div class="font-semibold text-gray-800">${esc(i.title)}</div>
        ${i.is_template ? '<span class="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full font-semibold">قالب</span>' : ''}
      </td>
      <td class="p-3 text-xs text-gray-600">${esc(i.destination||'—')}</td>
      <td class="p-3 text-xs text-gray-600">${dur}</td>
      <td class="p-3 font-bold text-green-700 text-xs">${fmt(i.sell_total)} EGP</td>
      <td class="p-3 text-xs font-bold ${(i.margin_pct||0)>=20?'text-primary':'text-amber-600'}">${(i.margin_pct||0).toFixed(1)}%</td>
      <td class="p-3"><span class="status-badge ${sMap[i.status]||'s-draft'}">${sLabel[i.status]||i.status}</span></td>
      <td class="p-3 text-xs text-gray-400">${new Date(i.created_at).toLocaleDateString('ar-EG')}</td>
      <td class="p-3">
        <div class="flex gap-1" onclick="event.stopPropagation()">
          <a href="/nsp-control-8x4k/itinerary-builder.html?id=${i.id}" class="text-gray-400 hover:text-primary p-1.5 rounded text-xs transition" title="فتح المحرر">
            <i class="fa-solid fa-pen"></i>
          </a>
          <button onclick="duplicate('${i.id}')" class="text-gray-400 hover:text-blue-500 p-1.5 rounded text-xs transition" title="نسخ">
            <i class="fa-solid fa-copy"></i>
          </button>
          <button onclick="archive('${i.id}','${i.status}')" class="text-gray-400 hover:text-amber-500 p-1.5 rounded text-xs transition" title="أرشفة">
            <i class="fa-solid fa-box-archive"></i>
          </button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function open_(id) {
  window.location.href = `/nsp-control-8x4k/itinerary-builder.html?id=${id}`;
}

async function duplicate(id) {
  const src = _all.find(i => i.id === id);
  if (!src || !confirm('نسخ هذا الجدول السياحي؟')) return;
  const { data: days } = await db.from('itinerary_days').select('*').eq('itinerary_id', id).order('sort_order');
  const { data: newItn } = await db.from('itineraries').insert({
    title: (src.title||'') + ' (نسخة)',
    destination: src.destination,
    trip_type: src.trip_type,
    currency: src.currency,
    adults_count: src.adults_count,
    children_count: src.children_count,
    notes: src.notes,
    is_template: src.is_template,
    status: 'draft',
  }).select('id').single();
  if (!newItn) return;

  for (const day of (days||[])) {
    const { data: items } = await db.from('itinerary_items').select('*').eq('itinerary_day_id', day.id);
    const { data: newDay } = await db.from('itinerary_days').insert({
      itinerary_id: newItn.id, day_number: day.day_number, date: day.date,
      city: day.city, title: day.title, description: day.description,
      overnight_city: day.overnight_city, meal_plan: day.meal_plan, sort_order: day.sort_order
    }).select('id').single();
    if (!newDay) continue;
    for (const item of (items||[])) {
      const { id: _omit, itinerary_day_id: _o2, itinerary_id: _o3, ...rest } = item;
      await db.from('itinerary_items').insert({ ...rest, itinerary_day_id: newDay.id, itinerary_id: newItn.id });
    }
  }
  toast('تم نسخ الجدول السياحي ✓');
  await load();
}

async function archive(id, status) {
  if (status === 'archived') {
    await db.from('itineraries').update({ status: 'draft' }).eq('id', id);
    toast('تم إلغاء الأرشفة');
  } else {
    if (!confirm('أرشفة هذا الجدول؟')) return;
    await db.from('itineraries').update({ status: 'archived' }).eq('id', id);
    toast('تمت الأرشفة');
  }
  await load();
}

function fmt(n) { return (n||0).toLocaleString('ar-EG', { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg, err) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = err ? '#c62828' : '#1B5E20';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}
</script>
</body>
</html>
