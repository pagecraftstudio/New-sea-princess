<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تحليل الموردين — Flow Travel</title>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        primary: { DEFAULT: '#1B5E20', light: '#2E7D32' },
        accent:  { DEFAULT: '#B8860B' },
        ai:      { DEFAULT: '#7c3aed', bg: '#f5f3ff' }
      }}}
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/erp-ui.css" />
  <link rel="stylesheet" href="/css/custom.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/admin-nav.js"></script>
  <script src="/js/ai-service.js"></script>
  <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <div id="adminNavMount"></div>

  <main class="flex-1 overflow-auto p-4 md:p-6">

    <div class="erp-page-header mb-5 flex items-center justify-between flex-wrap gap-3">
      <div>
        <h1 class="erp-page-title flex items-center gap-2">
          <i class="fa-solid fa-chart-bar text-purple-600"></i>
          تحليل الموردين الذكي
        </h1>
        <p class="text-sm text-gray-500 mt-1">تقييم أداء الموردين بناءً على البيانات الفعلية</p>
      </div>
    </div>

    <!-- Suppliers list + AI analysis -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

      <!-- Supplier list -->
      <div class="erp-card p-4">
        <h3 class="font-semibold text-gray-700 mb-3 text-sm">اختر موردًا للتحليل</h3>
        <input id="supplierSearch" type="text" placeholder="بحث…"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-purple-200" />
        <div id="supplierList" class="space-y-1.5 max-h-96 overflow-y-auto">
          <div class="text-center py-6 text-gray-400"><i class="fa-solid fa-spinner fa-spin"></i></div>
        </div>
      </div>

      <!-- AI Analysis panel -->
      <div class="md:col-span-2">
        <div id="supplierAnalysisPanel" class="erp-card p-5 h-full">
          <div class="flex items-center justify-center h-full text-gray-400 py-16">
            <div class="text-center">
              <i class="fa-solid fa-chart-bar text-4xl text-purple-200 mb-4 block"></i>
              <p class="text-sm">اختر موردًا من القائمة لعرض تحليله الذكي</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    let suppliers = [];
    let selectedSupplier = null;

    async function loadSuppliers() {
      const { data, error } = await window.db.from('suppliers')
        .select('id,name_ar,name_en,type,is_active')
        .order('name_ar');

      if (error || !data?.length) {
        document.getElementById('supplierList').innerHTML =
          '<div class="text-center text-gray-400 py-4 text-sm">لا يوجد موردون</div>';
        return;
      }

      suppliers = data;
      renderSupplierList(data);
    }

    function renderSupplierList(list) {
      const TYPE_ICONS = { hotel:'fa-hotel', airline:'fa-plane', visa:'fa-passport', transport:'fa-car', other:'fa-box' };
      document.getElementById('supplierList').innerHTML = list.map(s => `
        <button onclick="selectSupplier('${s.id}')"
          class="supplier-item w-full text-right px-3 py-2.5 rounded-lg hover:bg-purple-50 transition-colors flex items-center gap-2 ${!s.is_active ? 'opacity-50' : ''}">
          <i class="fa-solid ${TYPE_ICONS[s.type] || 'fa-box'} text-gray-400 w-4"></i>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium text-gray-800 truncate">${s.name_ar}</div>
            <div class="text-xs text-gray-400">${s.type}</div>
          </div>
          <i class="fa-solid fa-chevron-left text-gray-300 text-xs"></i>
        </button>`).join('');
    }

    document.getElementById('supplierSearch').addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      renderSupplierList(suppliers.filter(s =>
        s.name_ar.toLowerCase().includes(q) || (s.name_en||'').toLowerCase().includes(q)
      ));
    });

    async function selectSupplier(id) {
      // Highlight selected
      document.querySelectorAll('.supplier-item').forEach(el => el.classList.remove('bg-purple-50','ring-1','ring-purple-300'));
      const btn = document.querySelector(`[onclick="selectSupplier('${id}')"]`);
      if (btn) btn.classList.add('bg-purple-50','ring-1','ring-purple-300');

      selectedSupplier = id;
      const sup = suppliers.find(s => s.id === id);

      const panel = document.getElementById('supplierAnalysisPanel');
      panel.innerHTML = `
        <div class="flex items-center justify-between mb-4">
          <div>
            <h3 class="font-bold text-gray-800">${sup?.name_ar || ''}</h3>
            <p class="text-sm text-gray-500">${sup?.type || ''}</p>
          </div>
          <button onclick="runSupplierAnalysis()"
            class="inline-flex items-center gap-2 bg-purple-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-purple-700 transition-colors">
            <i class="fa-solid fa-sparkles"></i>
            تحليل ذكي
          </button>
        </div>
        <div id="supplierAIResult" class="border border-purple-100 rounded-xl bg-purple-50/50 p-4 text-sm text-gray-500 text-center py-8">
          اضغط "تحليل ذكي" للحصول على تقييم الأداء
        </div>
        <div class="mt-4 grid grid-cols-3 gap-3" id="supplierStatsGrid">
          <div class="text-center text-gray-400 col-span-3 py-4"><i class="fa-solid fa-spinner fa-spin"></i></div>
        </div>`;

      // Load basic stats while waiting for AI
      loadSupplierStats(id);
    }

    async function loadSupplierStats(supplierId) {
      const [billsRes, costsRes, ratesRes] = await Promise.allSettled([
        window.db.from('supplier_bills')
          .select('total_amount,paid_amount,status')
          .eq('supplier_id', supplierId),
        window.db.from('booking_costs')
          .select('amount').eq('supplier_id', supplierId),
        window.db.from('supplier_rates')
          .select('id', { count: 'exact', head: true })
          .eq('supplier_id', supplierId).eq('is_active', true),
      ]);

      const bills = billsRes.value?.data || [];
      const costs = costsRes.value?.data || [];
      const rateCount = ratesRes.value?.count || 0;
      const totalBilled = bills.reduce((s,b)=>s+(b.total_amount||0),0);
      const totalCosts  = costs.reduce((s,c)=>s+(c.amount||0),0);
      const paidBills   = bills.filter(b=>b.status==='paid').length;

      const grid = document.getElementById('supplierStatsGrid');
      if (!grid) return;
      grid.innerHTML = [
        { label: 'إجمالي الفواتير', value: bills.length, icon: 'fa-file-invoice', color: 'text-blue-600' },
        { label: 'تم السداد', value: paidBills, icon: 'fa-check-circle', color: 'text-green-600' },
        { label: 'إجمالي التكاليف', value: totalCosts.toLocaleString('ar-EG') + ' ج.م', icon: 'fa-coins', color: 'text-amber-600' },
        { label: 'تكاليف الحجوزات', value: costs.length, icon: 'fa-calendar', color: 'text-purple-600' },
        { label: 'أسعار نشطة', value: rateCount, icon: 'fa-tags', color: 'text-primary' },
        { label: 'إجمالي الفواتير (ج.م)', value: totalBilled.toLocaleString('ar-EG'), icon: 'fa-money-bill', color: 'text-red-600' },
      ].map(s => `
        <div class="bg-white rounded-lg p-3 border border-gray-100 text-center">
          <i class="fa-solid ${s.icon} ${s.color} text-lg mb-1 block"></i>
          <div class="font-bold text-sm ${s.color}">${s.value}</div>
          <div class="text-xs text-gray-400 mt-0.5">${s.label}</div>
        </div>`).join('');

      if (bills.length < 3 && costs.length < 3) {
        grid.innerHTML += `<div class="col-span-3 text-xs text-amber-600 bg-amber-50 rounded-lg p-3 text-center">
          <i class="fa-solid fa-triangle-exclamation mr-1"></i>
          بيانات غير كافية للتقييم الذكي الموثوق
        </div>`;
      }
    }

    async function runSupplierAnalysis() {
      const resultEl = document.getElementById('supplierAIResult');
      if (!resultEl || !selectedSupplier) return;

      resultEl.innerHTML = `<div class="text-center py-6"><i class="fa-solid fa-spinner fa-spin text-purple-500 text-xl"></i><div class="text-xs text-gray-400 mt-2">جاري التحليل…</div></div>`;

      try {
        const result = await window.AI.analyze('supplier_score', selectedSupplier, { context_type: 'supplier' });
        resultEl.innerHTML = `<div class="prose prose-sm">${window.AIPanel.renderMarkdown(result)}</div>`;
      } catch (err) {
        resultEl.innerHTML = `<div class="text-red-500 text-sm py-4 text-center">خطأ: ${err.message}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (!await adminCheckAuth()) return;
      loadSuppliers();
    });
  </script>
</body>
</html>
