<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لا يوجد اتصال | نيو سي برنسيس</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Cairo',sans-serif;
      background:linear-gradient(155deg,#0D1B0E 0%,#132415 55%,#0A150B 100%);
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      color:#fff; padding:20px; direction:rtl;
    }
    .geo {
      position:fixed; inset:0; pointer-events:none; z-index:0;
      background-image:
        repeating-linear-gradient(0deg,rgba(184,134,11,.04) 0,rgba(184,134,11,.04) 1px,transparent 1px,transparent 40px),
        repeating-linear-gradient(90deg,rgba(184,134,11,.04) 0,rgba(184,134,11,.04) 1px,transparent 1px,transparent 40px);
    }
    .card {
      position:relative; z-index:1; text-align:center;
      max-width:420px; width:100%;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(184,134,11,.2);
      border-radius:24px; padding:48px 32px;
      backdrop-filter:blur(8px);
    }
    .icon-wrap {
      width:80px; height:80px; margin:0 auto 24px;
      background:rgba(184,134,11,.15);
      border:2px solid rgba(184,134,11,.3);
      border-radius:50%;
      display:flex; align-items:center; justify-content:center;
    }
    .icon-wrap svg { width:36px; height:36px; color:#B8860B; fill:none; stroke:#B8860B; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    h1 { font-size:22px; font-weight:800; margin-bottom:10px; color:#fff; }
    p  { font-size:14px; color:rgba(255,255,255,.6); line-height:1.7; margin-bottom:8px; }
    .divider { height:1px; background:rgba(184,134,11,.2); margin:24px 0; }
    .tips { text-align:right; }
    .tips li { font-size:13px; color:rgba(255,255,255,.5); margin-bottom:8px; display:flex; align-items:flex-start; gap:8px; list-style:none; }
    .tips li::before { content:'•'; color:#B8860B; flex-shrink:0; margin-top:1px; }
    .btn-retry {
      display:inline-flex; align-items:center; gap:8px; margin-top:28px;
      background:linear-gradient(135deg,#B8860B,#9a7209);
      color:#fff; padding:12px 28px; border-radius:12px;
      font-family:'Cairo',sans-serif; font-weight:800; font-size:15px;
      border:none; cursor:pointer;
      box-shadow:0 4px 16px rgba(184,134,11,.35);
      transition:transform .2s, box-shadow .2s;
      text-decoration:none;
    }
    .btn-retry:hover { transform:translateY(-1px); box-shadow:0 8px 22px rgba(184,134,11,.45); }

    /* pulse animation on the wifi icon */
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .icon-wrap { animation:pulse 2.5s ease-in-out infinite; }
  </style>
</head>
<body>
<div class="geo"></div>

<div class="card">
  <div class="icon-wrap">
    <!-- Wifi-off SVG -->
    <svg viewBox="0 0 24 24">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div>

  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>يبدو أن الاتصال انقطع. تحقق من الشبكة وأعد المحاولة.</p>

  <div class="divider"></div>

  <ul class="tips">
    <li>تأكد من تشغيل الـ Wi-Fi أو بيانات الجوال</li>
    <li>الصفحات التي زرتها من قبل متاحة بدون إنترنت</li>
    <li>إذا كنت في منتصف حجز — بياناتك محفوظة كمسودة</li>
  </ul>

  <button class="btn-retry" onclick="retry()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"/>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
    </svg>
    إعادة المحاولة
  </button>
</div>

<script>
  function retry() {
    // Try to reload; if still offline SW will serve cache or this page again
    window.location.reload();
  }

  // Auto-retry when connection is restored
  window.addEventListener('online', () => {
    window.location.href = document.referrer || '/';
  });
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
