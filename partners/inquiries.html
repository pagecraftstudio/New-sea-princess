<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلباتي — بوابة الشركاء</title>
  <script>tailwind={config:{theme:{extend:{colors:{primary:"#1B5E20",gold:"#B8860B"},fontFamily:{sans:["Cairo","sans-serif"]}}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js"></script>
  <script src="/js/partner-auth.js"></script>
  <script src="/js/partner-layout.js"></script>
  <style>
    body{font-family:'Cairo',sans-serif;background:#f3f4f6;}
    .card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 1px 8px rgba(0,0,0,.06);border:1px solid #e5e7eb;}
    .badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:9999px;font-size:.72rem;font-weight:700;}
    .s-new{background:#dbeafe;color:#1d4ed8;}
    .s-review{background:#fef3c7;color:#b45309;}
    .s-quoted{background:#d1fae5;color:#065f46;}
    .s-closed{background:#f3f4f6;color:#6b7280;}
    label{font-size:12px;font-weight:700;color:#374151;display:block;margin-bottom:3px;}
    input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:8px 11px;font-family:'Cairo',sans-serif;font-size:13px;outline:none;}
    input:focus,select:focus,textarea:focus{border-color:#1B5E20;box-shadow:0 0 0 3px rgba(27,94,32,.1);}
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1B5E20;color:#fff;padding:10px 24px;border-radius:24px;font-size:.85rem;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;}
    #toast.show{opacity:1;}
  </style>
</head>
<body class="min-h-screen">
<div class="flex min-h-screen">
  <div id="partnerNavMount" class="flex"></div>

  <main class="flex-1 overflow-auto p-4 md:p-6">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl font-black text-gray-800"><i class="fa-solid fa-paper-plane text-primary ml-2"></i>طلباتي</h1>
        <p class="text-sm text-gray-400">استعرض وأرسل طلبات جديدة</p>
      </div>
      <button onclick="openModal()" class="bg-primary text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-green-800 transition flex items-center gap-2">
        <i class="fa-solid fa-plus"></i>طلب جديد
      </button>
    </div>

    <!-- Filter tabs -->
    <div class="flex gap-2 mb-4 flex-wrap">
      <button onclick="setFilter('all',this)" class="px-4 py-1.5 rounded-lg text-xs font-bold border-2 border-primary text-primary bg-primary/5 transition active-tab">الكل</button>
      <button onclick="setFilter('new',this)" class="px-4 py-1.5 rounded-lg text-xs font-bold border border-gray-200 text-gray-600 hover:border-primary transition">جديد</button>
      <button onclick="setFilter('under_review',this)" class="px-4 py-1.5 rounded-lg text-xs font-bold border border-gray-200 text-gray-600 hover:border-primary transition">قيد المراجعة</button>
      <button onclick="setFilter('quoted',this)" class="px-4 py-1.5 rounded-lg text-xs font-bold border border-gray-200 text-gray-600 hover:border-primary transition">صدر عرض سعر</button>
      <button onclick="setFilter('closed',this)" class="px-4 py-1.5 rounded-lg text-xs font-bold border border-gray-200 text-gray-600 hover:border-primary transition">مغلق</button>
    </div>

    <!-- List -->
    <div class="card">
      <div id="inquiryList" class="space-y-3">
        <div class="text-center py-10 text-gray-400"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>
      </div>
    </div>
  </main>
</div>

<!-- New Inquiry Modal -->
<div id="iqModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl w-full max-w-xl max-h-[90vh] flex flex-col">
    <div class="flex items-center justify-between p-5 border-b">
      <h3 class="font-black text-gray-800"><i class="fa-solid fa-paper-plane text-primary ml-2"></i>طلب جديد</h3>
      <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 text-xl"><i class="fa-solid fa-times"></i></button>
    </div>
    <div class="overflow-y-auto flex-1 p-5 grid gap-4">
      <div>
        <label>عنوان الطلب *</label>
        <input type="text" id="iq_title" placeholder="مثال: رحلة القاهرة 4 ليالي — فبراير 2026">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label>الوجهة</label>
          <input type="text" id="iq_dest" placeholder="مثال: القاهرة، الأقصر">
        </div>
        <div>
          <label>فئة الفندق</label>
          <select id="iq_hotel">
            <option value="">غير محدد</option>
            <option value="3">3 نجوم</option>
            <option value="4">4 نجوم</option>
            <option value="5">5 نجوم</option>
            <option value="luxury">فاخر</option>
          </select>
        </div>
        <div>
          <label>تاريخ البدء</label>
          <input type="date" id="iq_from">
        </div>
        <div>
          <label>تاريخ الانتهاء</label>
          <input type="date" id="iq_to">
        </div>
        <div>
          <label>عدد البالغين</label>
          <input type="number" id="iq_adults" value="2" min="1">
        </div>
        <div>
          <label>عدد الأطفال</label>
          <input type="number" id="iq_children" value="0" min="0">
        </div>
        <div>
          <label>الميزانية / شخص (USD)</label>
          <input type="number" id="iq_budget" placeholder="اختياري" min="0">
        </div>
        <div class="flex flex-col gap-2 justify-end">
          <label class="flex items-center gap-2 cursor-pointer mb-0 mt-3">
            <input type="checkbox" id="iq_transport" class="w-4 h-4 accent-green-700">
            <span class="text-sm font-semibold">نقل مطلوب</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer mb-0">
            <input type="checkbox" id="iq_guide" class="w-4 h-4 accent-green-700">
            <span class="text-sm font-semibold">مرشد مطلوب</span>
          </label>
        </div>
      </div>
      <div>
        <label>طلبات خاصة / ملاحظات</label>
        <textarea id="iq_notes" rows="3" placeholder="أي متطلبات إضافية..."></textarea>
      </div>
      <p id="iqErr" class="hidden text-red-500 text-sm font-bold"></p>
    </div>
    <div class="flex gap-3 justify-end p-5 border-t">
      <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-gray-200 text-sm font-bold text-gray-600 hover:bg-gray-50 transition">إلغاء</button>
      <button onclick="submitInquiry()" class="bg-primary text-white px-5 py-2 rounded-xl text-sm font-bold hover:bg-green-800 transition">
        <i class="fa-solid fa-paper-plane ml-1"></i>إرسال الطلب
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let _filter = 'all';
let _all = [];

document.addEventListener('DOMContentLoaded', async () => {
  const ppu = await PartnerAuth.requirePartnerAuth();
  if (!ppu) return;
  PartnerLayout.init();
  await load();
});

async function load() {
  const pid = PartnerAuth.getPartnerId();
  const { data } = await db.from('partner_inquiries')
    .select('*').eq('partner_id', pid).order('created_at', {ascending:false});
  _all = data || [];
  render();
}

function setFilter(f, btn) {
  _filter = f;
  document.querySelectorAll('[onclick^="setFilter"]').forEach(b => {
    b.className = 'px-4 py-1.5 rounded-lg text-xs font-bold border border-gray-200 text-gray-600 hover:border-primary transition';
  });
  btn.className = 'px-4 py-1.5 rounded-lg text-xs font-bold border-2 border-primary text-primary bg-primary/5 transition';
  render();
}

function render() {
  const rows = _filter === 'all' ? _all : _all.filter(i => i.status === _filter);
  const el = document.getElementById('inquiryList');
  if (!rows.length) {
    el.innerHTML = '<p class="text-center text-gray-400 py-10">لا توجد طلبات</p>';
    return;
  }
  const sMap = {new:'s-new جديد',under_review:'s-review قيد المراجعة',quoted:'s-quoted صدر عرض سعر',closed:'s-closed مغلق'};
  el.innerHTML = rows.map(i => {
    const [sc, sl] = (sMap[i.status] || 's-new جديد').split(' ');
    return `<div class="flex items-start gap-4 p-4 border border-gray-100 rounded-xl hover:border-primary/30 transition">
      <div class="w-10 h-10 rounded-xl bg-green-50 flex items-center justify-center text-primary shrink-0 mt-0.5">
        <i class="fa-solid fa-paper-plane text-sm"></i>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="font-bold text-sm text-gray-800">${esc(i.title)}</span>
          <span class="badge ${sc}">${sl}</span>
        </div>
        <div class="text-xs text-gray-400 mt-1 flex gap-3 flex-wrap">
          ${i.destination ? `<span><i class="fa-solid fa-location-dot ml-1"></i>${esc(i.destination)}</span>` : ''}
          ${i.travel_date_from ? `<span><i class="fa-regular fa-calendar ml-1"></i>${i.travel_date_from}</span>` : ''}
          <span><i class="fa-solid fa-users ml-1"></i>${i.adults_count || 0} بالغ${i.children_count ? ' + '+i.children_count+' طفل' : ''}</span>
          <span class="text-gray-300">${new Date(i.created_at).toLocaleDateString('ar-EG')}</span>
        </div>
        ${i.special_requests ? `<p class="text-xs text-gray-400 mt-1 line-clamp-1">${esc(i.special_requests)}</p>` : ''}
      </div>
    </div>`;
  }).join('');
}

function openModal() { document.getElementById('iqModal').classList.remove('hidden'); }
function closeModal() { document.getElementById('iqModal').classList.add('hidden'); }

async function submitInquiry() {
  const title = document.getElementById('iq_title').value.trim();
  const err = document.getElementById('iqErr');
  err.classList.add('hidden');
  if (!title) { err.textContent='الرجاء إدخال عنوان الطلب'; err.classList.remove('hidden'); return; }
  const { data:{session} } = await db.auth.getSession();
  const { error } = await db.from('partner_inquiries').insert({
    partner_id: PartnerAuth.getPartnerId(),
    submitted_by: session.user.id,
    title,
    destination: document.getElementById('iq_dest').value.trim()||null,
    travel_date_from: document.getElementById('iq_from').value||null,
    travel_date_to: document.getElementById('iq_to').value||null,
    adults_count: parseInt(document.getElementById('iq_adults').value)||2,
    children_count: parseInt(document.getElementById('iq_children').value)||0,
    hotel_class: document.getElementById('iq_hotel').value||null,
    budget_per_pax: parseFloat(document.getElementById('iq_budget').value)||null,
    transport_needed: document.getElementById('iq_transport').checked,
    guide_needed: document.getElementById('iq_guide').checked,
    special_requests: document.getElementById('iq_notes').value.trim()||null,
  });
  if (error) { err.textContent='خطأ: '+error.message; err.classList.remove('hidden'); return; }
  closeModal();
  toast('تم إرسال الطلب بنجاح ✓');
  await load();
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(msg,err){const el=document.getElementById('toast');el.textContent=msg;el.style.background=err?'#c62828':'#1B5E20';el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800);}
</script>
</body>
</html>
