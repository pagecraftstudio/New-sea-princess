<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض السعر</title>
  <script>tailwind={config:{theme:{extend:{colors:{primary:"#1B5E20",lightGreen:"#2E7D32",gold:"#B8860B",lightGold:"#DAA520",darkBg:"#0D1B0E",offWhite:"#F8F5EC",borderGold:"#D4AF6A"},fontFamily:{sans:["Cairo","sans-serif"]}}}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; background: #f3f4f6; }
    .badge { display:inline-flex;align-items:center;padding:2px 12px;border-radius:9999px;font-size:.75rem;font-weight:700; }
    .item-card { background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;border:1px solid #e5e7eb; }
    .trow { display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:13px; }
    .trow.grand { background:#f0fdf4;font-weight:900;font-size:16px;border-top:2px solid #1B5E20;border-radius:0 0 10px 10px; }
    @media print {
      .no-print { display:none!important; }
      body { background:#fff; }
    }
  </style>
</head>
<body class="min-h-screen">

<!-- Loading State -->
<div id="loadingState" class="flex items-center justify-center min-h-screen">
  <div class="text-center">
    <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
    <p class="text-gray-500 text-sm">جارٍ تحميل عرض السعر…</p>
  </div>
</div>

<!-- Error State -->
<div id="errorState" class="hidden flex items-center justify-center min-h-screen">
  <div class="text-center max-w-md px-4">
    <div class="text-6xl mb-4">😞</div>
    <h2 class="text-xl font-bold text-gray-700 mb-2">عرض السعر غير متاح</h2>
    <p class="text-gray-500 text-sm" id="errorMsg">هذا الرابط غير صالح أو أن عرض السعر ملغي.</p>
  </div>
</div>

<!-- Quote Content -->
<div id="quoteContent" class="hidden max-w-3xl mx-auto px-4 py-6">

  <!-- Header Card -->
  <div class="bg-primary text-white rounded-2xl p-5 mb-5 shadow-lg">
    <div class="flex items-start justify-between flex-wrap gap-3">
      <div>
        <div class="text-xs opacity-70 mb-1">عرض سعر</div>
        <div class="text-2xl font-black" id="quoteTitle">—</div>
        <div class="text-sm opacity-80 mt-1" id="quoteNumber">—</div>
      </div>
      <div class="text-left">
        <span id="statusBadge" class="badge bg-white text-primary text-xs">—</span>
        <div class="text-xs opacity-70 mt-2" id="versionBadge"></div>
      </div>
    </div>
  </div>

  <!-- Validity Alert -->
  <div id="validityAlert" class="hidden mb-4 rounded-xl px-4 py-3 text-sm font-bold flex items-center gap-2"></div>

  <!-- Meta Info -->
  <div class="bg-white rounded-2xl shadow-sm p-5 mb-4">
    <h3 class="font-bold text-primary mb-3 text-sm"><i class="fa-solid fa-circle-info ml-2"></i>تفاصيل الرحلة</h3>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 text-sm" id="metaGrid"></div>
  </div>

  <!-- KPI Strip -->
  <div class="grid grid-cols-3 gap-3 mb-4" id="kpiStrip"></div>

  <!-- Items -->
  <div class="bg-white rounded-2xl shadow-sm p-5 mb-4">
    <h3 class="font-bold text-primary mb-4 text-sm"><i class="fa-solid fa-list ml-2"></i>بنود الخدمات</h3>
    <div id="itemsList"></div>

    <!-- Totals -->
    <div class="border border-gray-100 rounded-xl overflow-hidden mt-4" id="totalsBox"></div>
  </div>

  <!-- Inclusions / Exclusions -->
  <div id="inclExclSection" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"></div>

  <!-- Notes & Terms -->
  <div id="notesTermsSection" class="hidden bg-white rounded-2xl shadow-sm p-5 mb-4"></div>

  <!-- Actions -->
  <div class="no-print flex gap-3 flex-wrap mb-8">
    <button onclick="window.print()"
      class="bg-primary text-white font-bold text-sm px-5 py-2.5 rounded-xl hover:bg-lightGreen transition flex items-center gap-2">
      <i class="fa-solid fa-print"></i> طباعة / حفظ PDF
    </button>
    <a href="/" class="bg-white text-gray-700 font-bold text-sm px-5 py-2.5 rounded-xl border border-gray-200 hover:bg-gray-50 transition flex items-center gap-2">
      <i class="fa-solid fa-home"></i> الرئيسية
    </a>
  </div>

  <!-- Footer -->
  <div class="text-center text-xs text-gray-400 pb-6">
    نيو سي برنسيس فرع الزقازيق &nbsp;•&nbsp; شركة سياحة (أ) ترخيص رقم 926
  </div>

</div>

<script>
// ══════════════════════════════════════════════════════════
//  QUOTE PUBLIC VIEW  — No Auth Required
//  Reads via get_quote_by_token() RPC (SECURITY DEFINER)
//  Never exposes cost_total / margin / internal notes
// ══════════════════════════════════════════════════════════

const TOKEN = new URLSearchParams(location.search).get('token');

const STATUS_LABEL = {
  draft:'مسودة', internal_review:'مراجعة داخلية', sent:'مُرسل', viewed:'تمت المشاهدة',
  revision_requested:'طُلبت مراجعة', negotiation:'تفاوض', accepted:'مقبول',
  deposit_pending:'انتظار عربون', confirmed:'مؤكد', expired:'منتهي الصلاحية',
  rejected:'مرفوض', cancelled:'ملغي'
};

const ITEM_TYPE_AR = {
  hotel:'فندق 🏨', flight:'طيران ✈️', transport:'مواصلات 🚌', guide:'مرشد 🧭',
  visa:'تأشيرة 📋', excursion:'رحلة يومية 🗺️', meal:'وجبات 🍽️', ticket:'تذاكر 🎫', other:'أخرى 📦'
};

(async () => {
  if (!TOKEN) return showError('رابط غير صالح — لا يحتوي على رمز التعريف.');

  // Mark as viewed: fire-and-forget via update RPC
  // (We call get_quote_by_token first which is the canonical read)
  let quoteJson;
  try {
    const { data, error } = await db.rpc('get_quote_by_token', { p_token: TOKEN });
    if (error) throw error;
    quoteJson = typeof data === 'string' ? JSON.parse(data) : data;
  } catch (e) {
    return showError('لم يتم العثور على عرض السعر أو أنه غير متاح حالياً.');
  }

  if (!quoteJson) return showError('عرض السعر غير موجود أو تم إلغاؤه.');

  render(quoteJson);

  // Silently try to mark as "viewed" if status is "sent"
  if (quoteJson.status === 'sent') {
    try {
      await db.from('quotations')
        .update({ status: 'viewed', viewed_at: new Date().toISOString() })
        .eq('public_token', TOKEN)
        .eq('status', 'sent');
    } catch (_) { /* silent */ }
  }
})();

function showError(msg) {
  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('errorState').classList.remove('hidden');
  document.getElementById('errorMsg').textContent = msg;
}

function render(q) {
  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('quoteContent').classList.remove('hidden');
  document.title = `عرض السعر ${q.quote_number||''} — ${q.title||''}`;

  const fmt     = n => Number(n||0).toLocaleString('ar-EG', {minimumFractionDigits:2, maximumFractionDigits:2});
  const fmtDate = d => d ? new Date(d).toLocaleDateString('ar-EG') : '—';
  const curr    = q.currency || 'EGP';

  // ── Header ─────────────────────────────────────────────
  document.getElementById('quoteTitle').textContent   = q.title || 'عرض سعر';
  document.getElementById('quoteNumber').textContent  = q.quote_number || '';
  document.getElementById('statusBadge').textContent  = STATUS_LABEL[q.status] || q.status;
  if (q.version > 1) {
    document.getElementById('versionBadge').textContent = `الإصدار ${q.version}`;
  }

  // ── Validity alert ─────────────────────────────────────
  if (q.validity_date) {
    const va = document.getElementById('validityAlert');
    const isExpired = new Date(q.validity_date) < new Date();
    va.classList.remove('hidden');
    if (isExpired || q.status === 'expired') {
      va.className = 'mb-4 rounded-xl px-4 py-3 text-sm font-bold flex items-center gap-2 bg-red-50 border border-red-200 text-red-700';
      va.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> انتهت صلاحية هذا العرض في ${fmtDate(q.validity_date)}`;
    } else {
      va.className = 'mb-4 rounded-xl px-4 py-3 text-sm font-bold flex items-center gap-2 bg-yellow-50 border border-yellow-200 text-yellow-800';
      va.innerHTML = `<i class="fa-solid fa-clock"></i> هذا العرض صالح حتى ${fmtDate(q.validity_date)}`;
    }
  }

  // ── Meta Grid ──────────────────────────────────────────
  const paxParts = [];
  if (Number(q.adults_count||0) > 0)   paxParts.push(`${q.adults_count} بالغ`);
  if (Number(q.children_count||0) > 0) paxParts.push(`${q.children_count} طفل`);
  if (Number(q.infants_count||0) > 0)  paxParts.push(`${q.infants_count} رضيع`);

  const metaItems = [
    { icon:'fa-map-marker-alt', label:'الوجهة',       val: q.destination || '—' },
    { icon:'fa-calendar',       label:'تاريخ السفر',   val: q.travel_date_from ? fmtDate(q.travel_date_from) + (q.travel_date_to ? ' — ' + fmtDate(q.travel_date_to) : '') : '—' },
    { icon:'fa-users',          label:'المسافرون',     val: paxParts.join(' • ') || '—' },
    { icon:'fa-coins',          label:'العملة',        val: curr },
    { icon:'fa-calendar-check', label:'صالح حتى',     val: fmtDate(q.validity_date) },
    { icon:'fa-hashtag',        label:'رقم العرض',     val: q.quote_number || '—' },
  ];

  document.getElementById('metaGrid').innerHTML = metaItems.map(m =>
    `<div>
       <div class="text-xs text-gray-400 mb-0.5"><i class="fa-solid ${m.icon} ml-1"></i>${m.label}</div>
       <div class="font-bold text-gray-700">${m.val}</div>
     </div>`
  ).join('');

  // ── KPI Strip ──────────────────────────────────────────
  document.getElementById('kpiStrip').innerHTML = `
    <div class="bg-white rounded-xl p-4 shadow-sm border-b-2 border-primary text-center">
      <div class="text-xs text-gray-500 mb-1">المجموع</div>
      <div class="font-black text-primary text-lg">${fmt(q.subtotal)}</div>
      <div class="text-xs text-gray-400">${curr}</div>
    </div>
    <div class="bg-white rounded-xl p-4 shadow-sm border-b-2 border-gold text-center">
      <div class="text-xs text-gray-500 mb-1">الخصم</div>
      <div class="font-black text-yellow-600 text-lg">${Number(q.discount_amount||0) > 0 ? '- ' + fmt(q.discount_amount) : '—'}</div>
      <div class="text-xs text-gray-400">${Number(q.discount_pct||0) > 0 ? q.discount_pct + '%' : ''}</div>
    </div>
    <div class="bg-white rounded-xl p-4 shadow-sm border-b-2 border-green-500 text-center">
      <div class="text-xs text-gray-500 mb-1">الإجمالي النهائي</div>
      <div class="font-black text-green-600 text-lg">${fmt(q.total_amount)}</div>
      <div class="text-xs text-gray-400">${curr}</div>
    </div>`;

  // ── Items ──────────────────────────────────────────────
  const items = q.items || [];
  const itemsHtml = items.length === 0
    ? '<p class="text-gray-400 text-sm text-center py-6">لا توجد بنود</p>'
    : items.map((it, i) => {
        const typeLabel = ITEM_TYPE_AR[it.item_type] || it.item_type || '📦 أخرى';
        let dateRange = '';
        if (it.date_from || it.date_to) {
          dateRange = `<div class="text-xs text-gray-400 mt-0.5">${fmtDate(it.date_from)}${it.date_to && it.date_to !== it.date_from ? ' — ' + fmtDate(it.date_to) : ''}</div>`;
        }
        const nights = it.nights ? `<span class="text-xs text-gray-400 ml-2">${it.nights} ليلة</span>` : '';
        return `<div class="item-card">
          <div class="flex justify-between items-start gap-3">
            <div class="flex-1">
              <div class="font-bold text-gray-800 text-sm">${it.description||'—'}</div>
              ${dateRange}
              <div class="text-xs text-gray-400 mt-1">${typeLabel} ${nights}</div>
            </div>
            <div class="text-left flex-shrink-0">
              <div class="text-xs text-gray-400">${it.quantity||1} × ${fmt(it.unit_price)} ${curr}</div>
              <div class="font-black text-primary text-base mt-0.5">${fmt(it.total_price)} ${curr}</div>
            </div>
          </div>
        </div>`;
      }).join('');

  document.getElementById('itemsList').innerHTML = itemsHtml;

  // ── Totals Box ─────────────────────────────────────────
  let totalsHtml = `<div class="trow"><span class="text-gray-500">المجموع قبل الخصم</span><span class="font-bold">${fmt(q.subtotal)} ${curr}</span></div>`;
  if (Number(q.discount_amount||0) > 0) {
    totalsHtml += `<div class="trow"><span class="text-yellow-600">خصم (${q.discount_pct||0}%)</span><span class="font-bold text-yellow-600">- ${fmt(q.discount_amount)} ${curr}</span></div>`;
  }
  if (Number(q.tax_amount||0) > 0) {
    totalsHtml += `<div class="trow"><span class="text-gray-500">ضريبة (${q.tax_pct||0}%)</span><span class="font-bold">${fmt(q.tax_amount)} ${curr}</span></div>`;
  }
  totalsHtml += `<div class="trow grand"><span class="text-primary">الإجمالي النهائي</span><span class="text-primary">${fmt(q.total_amount)} ${curr}</span></div>`;
  document.getElementById('totalsBox').innerHTML = totalsHtml;

  // ── Inclusions / Exclusions ────────────────────────────
  if (q.included_services || q.excluded_services) {
    const sec = document.getElementById('inclExclSection');
    sec.classList.remove('hidden');
    sec.innerHTML = `
      ${q.included_services ? `<div class="bg-green-50 border border-green-200 rounded-2xl p-4">
        <h3 class="font-bold text-green-700 text-sm mb-2"><i class="fa-solid fa-circle-check ml-2"></i>يشمل العرض</h3>
        <div class="text-sm text-gray-700 whitespace-pre-line">${q.included_services}</div>
      </div>` : ''}
      ${q.excluded_services ? `<div class="bg-red-50 border border-red-200 rounded-2xl p-4">
        <h3 class="font-bold text-red-700 text-sm mb-2"><i class="fa-solid fa-circle-xmark ml-2"></i>لا يشمل العرض</h3>
        <div class="text-sm text-gray-700 whitespace-pre-line">${q.excluded_services}</div>
      </div>` : ''}`;
  }

  // ── Notes & Terms ──────────────────────────────────────
  if (q.client_notes || q.payment_terms || q.cancellation_policy) {
    const sec = document.getElementById('notesTermsSection');
    sec.classList.remove('hidden');
    sec.innerHTML = `
      ${q.client_notes ? `<div class="mb-4">
        <h3 class="font-bold text-primary text-sm mb-2"><i class="fa-solid fa-note-sticky ml-2"></i>ملاحظات</h3>
        <div class="text-sm text-gray-700 whitespace-pre-line bg-gray-50 rounded-xl p-3">${q.client_notes}</div>
      </div>` : ''}
      ${q.payment_terms ? `<div class="mb-3">
        <div class="text-xs font-bold text-gray-500 mb-1">شروط الدفع</div>
        <div class="text-sm text-gray-700">${q.payment_terms}</div>
      </div>` : ''}
      ${q.cancellation_policy ? `<div>
        <div class="text-xs font-bold text-gray-500 mb-1">سياسة الإلغاء</div>
        <div class="text-sm text-gray-700">${q.cancellation_policy}</div>
      </div>` : ''}`;
  }
}
</script>
</body>
</html>
